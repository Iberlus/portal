<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E4068A">
<meta name="robots" content="noindex">
<title>Iberlus Comercial</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iberlus">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)} body{margin:0} [hidden]{display:none!important} img{max-width:100%}
/* Layout: app de móvil — cabecera fija, contenido en una columna (máx. 720px), barra inferior Clientes / Almacén */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#16213A; --muted:#5D6678; --line:#DDE2EA;
  --navy:#1F3864; --navy-ink:#FFFFFF; --slate:#44546A; --brand:#E4068A; --brand2:#00BFFF; --accent:var(--brand); --accent-soft:color-mix(in srgb,var(--brand) 9%,#FFFFFF); --on-accent:#FFFFFF;
  --good:#1E7B4E; --warn:#A35C00; --bad:#B42318; --chip:#EEF1F6; --open:#FBFCFE; --giro:#1D5FB8; --giro-soft:#E6EFFB;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#162034; --ink:#E6EBF4; --muted:#98A2B6; --line:#26324A;
  --navy:#1B2D52; --navy-ink:#E6EBF4; --slate:#30405C; --accent:color-mix(in srgb,var(--brand) 45%,#FFFFFF); --accent-soft:color-mix(in srgb,var(--brand) 30%,#162034); --on-accent:#0E1420;
  --good:#5CC290; --warn:#E3A24A; --bad:#F2877D; --chip:#1E2A42; --open:#1C2840; --giro:#8DB8F2; --giro-soft:#1C2C4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#162034; --ink:#E6EBF4; --muted:#98A2B6; --line:#26324A;
  --navy:#1B2D52; --navy-ink:#E6EBF4; --slate:#30405C; --accent:color-mix(in srgb,var(--brand) 45%,#FFFFFF); --accent-soft:color-mix(in srgb,var(--brand) 30%,#162034); --on-accent:#0E1420;
  --good:#5CC290; --warn:#E3A24A; --bad:#F2877D; --chip:#1E2A42; --open:#1C2840; --giro:#8DB8F2; --giro-soft:#1C2C4A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--ink);border-bottom:3px solid var(--accent)}
header.top .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.01em}
.brand h1 span{font-weight:600;color:var(--brand2)}
.brand h1 b{color:var(--accent)}
.brandid{display:flex;align-items:center;gap:10px}
.logo{display:inline-flex;background:#FFFFFF;border-radius:8px;padding:3px 6px}
.logo img{height:46px;width:auto;display:block}
.stamp{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.proto{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.proto .tag{text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.75}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
main{padding-block:14px 96px}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;min-width:0;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.count{font-size:12px;color:var(--muted);margin:0 0 8px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .right{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--muted);flex:none}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--accent);font-weight:600;padding:4px 0;cursor:pointer;margin-bottom:6px}
.client-head h2{margin:0;font-family:var(--f-display);font-size:21px;line-height:1.2;text-wrap:balance}
.client-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin:14px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.years{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.inv{border-top:1px solid var(--line)}
.inv:first-child{border-top:0}
.inv>button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:0;background:transparent;cursor:pointer;text-align:left}
@media (hover:hover){.inv>button:hover{background:var(--accent-soft)}}
.inv .num{font-weight:600;font-variant-numeric:tabular-nums}
.inv .date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.inv .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.inv .neg{color:var(--bad)}
.inv .chev{transition:transform .15s}
.inv[open-state="1"] .chev{transform:rotate(90deg)}
.lines{background:var(--bg);padding:4px 14px 10px;display:flex;flex-direction:column}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:7px 0;border-top:1px dashed var(--line);font-size:12.5px}
.ln:first-child{border-top:0}
.ln .d{min-width:0;overflow-wrap:anywhere}
.ln .c{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ln .p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln .p b{font-weight:700}
.ln .p s{color:var(--muted)}
.ln .q{text-align:right;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.dto{display:inline-block;background:var(--chip);border-radius:4px;padding:0 5px;margin:0 4px;font-size:11px;color:var(--muted)}
.art .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stock{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;text-align:right;min-width:56px}
.stock small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted)}
.stock.zero{color:var(--warn)} .stock.neg{color:var(--bad)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:14px}
.note b{color:var(--ink)}
.note.err{border-color:var(--bad)}
.note button{margin-top:10px}
.btn{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer}
.progress{display:flex;flex-direction:column;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
.progress div{display:flex;justify-content:space-between;gap:12px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .wrap{display:flex}
nav.bottom button{flex:1;border:0;background:transparent;padding:12px 8px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-selected="true"]{color:var(--accent)}
.amt2{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;line-height:1.25}
.amt2 b{display:block;font-weight:700}
.amt2 small{display:block;font-size:11.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.pend{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.par{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.mute{color:var(--muted);background:var(--chip)}
.fwrap{border-top:1px solid var(--line);scroll-margin-bottom:96px}
.fwrap:first-child{border-top:0}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 14px;font-size:13px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;font-family:inherit;color:inherit}
@media (hover:hover){.frow:hover{background:var(--accent-soft)}}
.inv{scroll-margin-bottom:96px}
.mcol{display:flex;flex-direction:column;min-width:96px}
.yoy{font-size:11.5px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.yoy .up{color:var(--good);font-weight:600} .yoy .down{color:var(--bad);font-weight:600}
.pill.giro{color:var(--giro);background:var(--giro-soft)}
.fwrap.open,.inv[open-state="1"]{position:relative}
.fwrap.open::before,.inv[open-state="1"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);z-index:1;pointer-events:none}
.fwrap.open .lines{background:var(--open)}
.inv .ident{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0;flex:1}
.age{font-weight:600;color:var(--warn)} .age.old{color:var(--bad)} .age.mute{color:var(--muted);font-weight:500}
.frow .who{font-weight:600;min-width:0;overflow-wrap:anywhere}
.frow .meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.frow .amt2{grid-row:span 2;align-self:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .sp{flex:1}
.pendbtn{border:1px solid var(--bad);color:var(--bad);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;cursor:pointer}
.pendbtn[aria-pressed="true"]{background:var(--bad);color:var(--on-accent)}
.sumbox{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;flex-wrap:wrap}
.sumbox .big{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sumbox .lbl{font-size:12px;color:var(--brand2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.month>button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:0;background:transparent;cursor:pointer;text-align:left}
@media (hover:hover){.month>button:hover{background:var(--accent-soft)}}
.month{border-top:1px solid var(--line)} .month:first-child{border-top:0}
.month .mname{font-weight:600;text-transform:capitalize;min-width:84px}
.month .chev{transition:transform .15s} .month[open-state="1"] .chev{transform:rotate(90deg)}
.month .inner{background:var(--bg)}
.pendline{margin-top:8px;font-size:13.5px;color:var(--bad)} .pendline b{font-variant-numeric:tabular-nums}
.pendline.ok{color:var(--good)}
.pendsum{width:100%;cursor:pointer;font:inherit;color:inherit;text-align:left}
.pendsum:hover{border-color:var(--bad)}
.dlrow{display:flex;justify-content:flex-end;padding-top:8px}
.btn.dl{font-size:13px;padding:7px 12px}
.btn.dl:disabled{opacity:.6;cursor:default}
.month>button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 10px}
.mcol{min-width:0}
.mname{white-space:nowrap}
.mcount{font-weight:500;color:var(--muted);font-size:12.5px;text-transform:none}
.yoy{white-space:normal}
.amt2 b,.amt2 small{white-space:nowrap}
.inv .num,.inv .date{white-space:nowrap}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px;min-width:0}
.dcard:hover{border-color:var(--accent)}
.dcard.wide{grid-column:1/-1}
.dlbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--brand2)}
.dbig{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dsub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dsub .up,.dcard .up{color:var(--good);font-weight:600} .dsub .down,.dcard .down{color:var(--bad);font-weight:600}
.dlist{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:baseline;padding:8px 0;border:0;border-top:1px solid var(--line);background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;font-size:13px}
.drow:first-child{border-top:0}
.drow .dn{font-weight:600;overflow-wrap:anywhere}
.drow .dd{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.drow .da{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.drow.debrow{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.drow .dm{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}
.amt2.bad b{color:var(--bad)}
@media (max-width:640px){.dcard.lcard{grid-column:1/-1}}
@media (max-width:360px){.dash{grid-template-columns:1fr}}
@media (max-width:440px){nav.bottom button{padding:10px 2px;font-size:11.5px}}
@media (max-width:440px){
  body{font-size:14px}
  .mname{font-size:14.5px} .mcount{font-size:11.5px}
  .yoy{font-size:11px}
  .amt2 b{font-size:14px} .amt2 small{font-size:11px}
  .month>button,.inv>button,.frow{padding-left:10px;padding-right:10px;gap:2px 8px}
  .frow{font-size:12.5px}
}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login .lg{display:flex;justify-content:center;margin-bottom:4px}
.login .lg img{height:70px;background:#FFFFFF;border-radius:10px;padding:4px 8px}
.login h2{margin:0;text-align:center;font-family:var(--f-display);font-size:20px}
.login p{margin:0;text-align:center;color:var(--muted);font-size:13px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.fld input{font:inherit;font-weight:400;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.fld input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn.wide{width:100%;padding:12px;font-size:15px}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;padding:4px;font-size:13px}
.msg{font-size:13px;text-align:center;min-height:1em}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.userbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.acc{display:flex;flex-direction:column;gap:12px}
.acc .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.acc h3{margin:0;font-family:var(--f-display);font-size:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pcard h3{margin:0;font-family:var(--f-display);font-size:16px}
.pcard textarea{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;min-height:70px}
.pcard textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.sugrow{border-top:1px solid var(--line);padding-top:8px;font-size:13.5px}
.client-head p{white-space:normal}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<section class="login" id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <div class="lg"><img src="logo.png" alt="Iberlus"></div>
    <h2>Portal comercial</h2>
    <p>Entra con tu email y tu contraseña.</p>
    <label class="fld" for="lgEmail">Email<input id="lgEmail" type="email" autocomplete="username" required></label>
    <label class="fld" for="lgPass">Contraseña<input id="lgPass" type="password" autocomplete="current-password" required></label>
    <button class="btn wide" id="lgBtn" type="submit">Entrar</button>
    <button class="linkbtn" id="lgForgot" type="button">He olvidado la contraseña</button>
    <div class="msg" id="lgMsg" role="status"></div>
  </form>
</section>

<div id="app" hidden>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="brandid"><span class="logo"><img src="logo.png" alt="Iberlus"></span><h1><span>Comercial</span></h1></div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="stamp" id="stamp">Cargando datos…</div><button class="userbtn" id="userBtn" type="button">Cuenta</button></div>
    </div>
    <div class="proto" id="adminBar" hidden>
      <span class="tag">Ver como</span>
      <div class="seg" role="group" aria-label="Ver como">
        <button id="as34" type="button" aria-pressed="true" data-com="34">Breno (34)</button>
        <button id="as36" type="button" aria-pressed="false" data-com="36">Paula (36)</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="bottom" aria-label="Secciones">
  <div class="wrap" role="tablist">
    <button id="navInicio" type="button" role="tab" aria-selected="true" data-sec="inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
      Inicio
    </button>
    <button id="navClientes" type="button" role="tab" aria-selected="false" data-sec="clientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>
      Clientes

  const w = Math.min(img.naturalWidth, 220), h = Math.max(1, Math.round(img.naturalHeight * w / img.naturalWidth));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data, b = new Map();
  for (let i = 0; i < d.length; i += 4){
    const r = d[i], g = d[i+1], bl = d[i+2];
    if (d[i+3] < 200 || Math.max(r,g,bl) - Math.min(r,g,bl) < 40) continue;
    const k = (r>>4) + "," + (g>>4) + "," + (bl>>4), e = b.get(k) || {n:0,r:0,g:0,b:0};
    e.n++; e.r += r; e.g += g; e.b += bl; b.set(k, e);
  }
  let best = null; for (const e of b.values()) if (!best || e.n > best.n) best = e;
  if (!best || best.n < 20) return null;
  let r = best.r/best.n, g = best.g/best.n, bb = best.b/best.n;
  const lum = (0.2126*r + 0.7152*g + 0.0722*bb) / 255;
  if (lum > 0.55){ const f = 0.55 / lum; r *= f; g *= f; bb *= f; }

  return "#" + hx(r) + hx(g) + hx(bb);
}

function pqChips(opts, cur, attr){ return '<div class="years">' + opts.map(o => '<button class="chipbtn" type="button" ' + attr + '="' + esc(o[0]) + '" aria-pressed="' + (String(o[0]) === String(cur)) + '">' + esc(o[1]) + '</button>').join("") + '</div>'; }
function pqRow(name, sub, right, attrs){ return '<button class="row" type="button" ' + (attrs || "") + '><div class="main"><div class="name" style="white-space:normal">' + name + '</div><div class="sub" style="white-space:normal">' + sub + '</div></div><div class="right" style="color:var(--ink)">' + right + '</div>' + chev + '</button>'; }
function priceHtml(price, dto){ const neto = price * (1 - dto / 100); return dto ? '<s style="color:var(--muted)">' + eur(price) + '</s><br><span class="dto">−' + num(dto) + ' %</span><b>' + eur(neto) + '</b>' : '<b>' + eur(price) + '</b>'; }

function viewPreguntas(){
  if (!S.pq){
    let h = '<div class="client-head"><h2>Preguntas</h2><p>Elige una pregunta. Las respuestas salen de tus datos de Factusol.</p></div><div class="list" style="margin-top:12px">' +
      PREGUNTAS.map(p => pqRow(esc(p.t), esc(p.d), "", 'data-pq="' + p.id + '"')).join("") + '</div>';
    h += '<div class="pcard"><h3>¿Echas en falta alguna pregunta?</h3><p class="count" style="margin:0">Díselo a Dani y la añadimos.</p></div>';
    view.innerHTML = h;
    view.querySelectorAll("[data-pq]").forEach(b => b.onclick = () => { S.pq = b.dataset.pq; S.pqQ = ""; S.pqArt = null; render(); window.scrollTo(0,0); });
    return;
  }
  const id = S.pq; let h = pqBack() + pqTitle(id);
  const all = S.data.all.filter(i => i.date), years = pqYears();
  if (!S.pqYear || !years.includes(S.pqYear)) S.pqYear = years[0];
  const nameOf = code => { const c = S.data.byCode.get(code); return c ? c.name : code; };

  if (id === "artcli"){
    const q = norm(S.pqQ || "");
    const list = S.data.clients.filter(c => c.nInv && (!q || norm(c.name + " " + c.fiscal + " " + c.code + " " + c.pob).includes(q))).sort((a,b) => a.name.localeCompare(b.name, "es")).slice(0, 60);
    h += '<div class="search"><input id="pqq" type="search" placeholder="Busca el cliente" value="' + esc(S.pqQ || "") + '" autocomplete="off" aria-label="Buscar cliente"></div>';
    h += '<div class="list">' + (list.length ? list.map(c => pqRow(esc(c.name), esc([fisc(c), c.code, c.pob].filter(Boolean).join(" · ")), "", 'data-cli="' + esc(c.code) + '"')).join("") : '<div class="empty">Ningún cliente coincide.</div>') + '</div>';
  }
  else if (id === "topcli" || id === "freq"){
    h += pqChips(years.map(y => [y, String(y)]), S.pqYear, "data-py");
    const m = new Map();
    all.filter(i => i.date.getFullYear() === S.pqYear).forEach(i => { const e = m.get(i.client) || { code: i.client, tot: 0, n: 0, dates: [] }; e.tot += i.total; e.n++; e.dates.push(+i.date); m.set(i.client, e); });
    let rows = [...m.values()];
    rows.forEach(e => { const d = [...new Set(e.dates)].sort((a,b) => a - b); e.every = d.length > 1 ? Math.round((d[d.length-1] - d[0]) / 864e5 / (d.length - 1)) : null; });
    if (id === "topcli") rows.sort((a,b) => b.tot - a.tot); else rows.sort((a,b) => b.n - a.n || (a.every ?? 1e9) - (b.every ?? 1e9));
    const tot = rows.reduce((s,e) => s + e.tot, 0);
    h += '<p class="count">' + rows.length + ' clientes con facturas en ' + S.pqYear + (id === "topcli" ? ' · ' + eur(tot) + ' con IVA' : '') + '</p>';
    h += '<div class="list">' + (rows.length ? rows.slice(0, 100).map((e, k) => pqRow((k + 1) + '. ' + esc(nameOf(e.code)),
        e.n + (e.n === 1 ? ' factura' : ' facturas') + (e.every ? ' · cada ' + e.every + ' días' : ''),
        id === "topcli" ? '<b>' + eur(e.tot) + '</b><br><small style="color:var(--muted)">' + (tot ? num(Math.round(e.tot / tot * 1000) / 10) + ' %' : '') + '</small>' : '<b>' + e.n + '</b>',
        'data-cli="' + esc(e.code) + '"')).join("") : '<div class="empty">Sin facturas ese año.</div>') + '</div>';
  }
  else if (id === "quien"){
    if (!S.pqArt){
      const arts = new Map(); all.forEach(i => i.lines.forEach(l => { if (l.code && !arts.has(l.code)) arts.set(l.code, l.desc); }));
      const words = norm(S.pqQ || "").split(/\s+/).filter(Boolean);
      const list = words.length ? [...arts.entries()].filter(([c,d]) => { const k = norm(c + " " + d); return words.every(w => k.includes(w)); }).slice(0, 60) : [];
      h += '<div class="search"><input id="pqq" type="search" placeholder="Busca el artículo por código o descripción" value="' + esc(S.pqQ || "") + '" autocomplete="off" aria-label="Buscar artículo"></div>';
      h += words.length ? '<div class="list">' + (list.length ? list.map(([c,d]) => pqRow(esc(d || c), '<span style="font-family:var(--f-mono)">' + esc(c) + '</span>', "", 'data-art="' + esc(c) + '"')).join("") : '<div class="empty">Ninguno de tus clientes ha comprado un artículo así.</div>') + '</div>'
        : '<div class="note">Escribe parte del código o de la descripción (por ejemplo <b>copa gastro</b>). Solo salen artículos que hayan comprado tus clientes.</div>';
    } else {
      const m = new Map(); let desc = "";
      all.slice().sort((a,b) => a.date - b.date).forEach(i => i.lines.forEach(l => { if (l.code !== S.pqArt) return; desc = l.desc || desc;
        const e = m.get(i.client) || { code: i.client, qty: 0 }; e.qty += l.qty; e.date = i.date; e.price = l.price; e.dto = l.dto; m.set(i.client, e); }));
      const rows = [...m.values()].sort((a,b) => b.date - a.date);
      h += '<p class="count"><span style="font-family:var(--f-mono)">' + esc(S.pqArt) + '</span> · ' + esc(desc) + ' · ' + rows.length + (rows.length === 1 ? ' cliente' : ' clientes') + ' · <button class="linkbtn" id="pqOtro" type="button">otro artículo</button></p>';
      h += '<div class="list">' + rows.map(e => pqRow(esc(nameOf(e.code)), 'última compra ' + fdate(e.date) + ' · ' + num(e.qty) + ' uds en total', priceHtml(e.price, e.dto), 'data-cli="' + esc(e.code) + '"')).join("") + '</div>';
    }
  }
  else if (id === "topart"){
    const now = new Date(), y = now.getFullYear();
    if (!["mes","anio","ant"].includes(S.pqPer)) S.pqPer = "anio";
    if (!["imp","uds"].includes(S.pqSort)) S.pqSort = "imp";
    h += pqChips([["mes","Este mes"],["anio","Este año"],["ant","Año " + (y - 1)]], S.pqPer, "data-pper");
    h += pqChips([["imp","Por importe"],["uds","Por unidades"]], S.pqSort, "data-psort");
    const inPer = d => S.pqPer === "mes" ? d.getFullYear() === y && d.getMonth() === now.getMonth() : S.pqPer === "anio" ? d.getFullYear() === y : d.getFullYear() === y - 1;
    const m = new Map();
    all.filter(i => inPer(i.date)).forEach(i => i.lines.forEach(l => { if (!l.code) return; const e = m.get(l.code) || { code: l.code, desc: l.desc, qty: 0, imp: 0, cli: new Set() }; e.qty += l.qty; e.imp += l.imp; e.cli.add(i.client); m.set(l.code, e); }));
    const rows = [...m.values()].sort(S.pqSort === "uds" ? (a,b) => b.qty - a.qty : (a,b) => b.imp - a.imp);
    h += '<p class="count">' + rows.length + ' artículos · importes sin IVA</p>';
    h += '<div class="list">' + (rows.length ? rows.slice(0, 100).map((e, k) => pqRow((k + 1) + '. ' + esc(e.desc || e.code),
        '<span style="font-family:var(--f-mono)">' + esc(e.code) + '</span> · ' + e.cli.size + (e.cli.size === 1 ? ' cliente' : ' clientes'),
        '<b>' + (S.pqSort === "uds" ? num(e.qty) + ' uds' : eur(e.imp)) + '</b><br><small style="color:var(--muted)">' + (S.pqSort === "uds" ? eur(e.imp) : num(e.qty) + ' uds') + '</small>',
        'data-art2="' + esc(e.code) + '"')).join("") : '<div class="empty">Sin ventas en ese periodo.</div>') + '</div>';
  }
  else if (id === "baja"){
    const now = new Date(), y = now.getFullYear(), lim = new Date(y - 1, now.getMonth(), now.getDate(), 23, 59);
    const m = new Map();
    all.forEach(i => { const d = i.date; let k = null;
      if (d.getFullYear() === y && d <= now) k = "cur"; else if (d.getFullYear() === y - 1 && d <= lim) k = "prev";
      if (!k) return; const e = m.get(i.client) || { code: i.client, cur: 0, prev: 0 }; e[k] += i.total; m.set(i.client, e); });
    const rows = [...m.values()].filter(e => e.prev > 0 && e.cur < e.prev).sort((a,b) => (b.prev - b.cur) - (a.prev - a.cur));
    h += '<p class="count">Del 1 de enero al ' + now.toLocaleDateString("es-ES",{day:"numeric",month:"long"}) + ', ' + (y - 1) + ' frente a ' + y + ' · ' + rows.length + ' clientes compran menos · con IVA</p>';
    h += '<div class="list">' + (rows.length ? rows.slice(0, 100).map(e => { const pc = Math.round((e.cur - e.prev) / e.prev * 100);
        return pqRow(esc(nameOf(e.code)), (y - 1) + ': ' + eur(e.prev) + ' → ' + y + ': ' + eur(e.cur), '<b style="color:var(--bad)">−' + num(Math.abs(pc)) + ' %</b><br><small style="color:var(--muted)">−' + eur(e.prev - e.cur) + '</small>', 'data-cli="' + esc(e.code) + '"'); }).join("")
      : '<div class="empty">Ningún cliente compra menos que el año pasado en este periodo.</div>') + '</div>';
  }
  view.innerHTML = h;
  document.getElementById("pqBack").onclick = () => { if (S.pq === "quien" && S.pqArt){ S.pqArt = null; } else { S.pq = null; } render(); window.scrollTo(0,0); };
  const inp = document.getElementById("pqq");
  if (inp){ let t; inp.oninput = () => { clearTimeout(t); t = setTimeout(() => { S.pqQ = inp.value; const pos = inp.selectionStart; render(); const n = document.getElementById("pqq"); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){} } }, 180); }; }
  view.querySelectorAll("[data-py]").forEach(b => b.onclick = () => { S.pqYear = +b.dataset.py; render(); });
  view.querySelectorAll("[data-pper]").forEach(b => b.onclick = () => { S.pqPer = b.dataset.pper; render(); });
  view.querySelectorAll("[data-psort]").forEach(b => b.onclick = () => { S.pqSort = b.dataset.psort; render(); });
  view.querySelectorAll("[data-art]").forEach(b => b.onclick = () => { S.pqArt = b.dataset.art; render(); window.scrollTo(0,0); });
  view.querySelectorAll("[data-art2]").forEach(b => b.onclick = () => { S.pq = "quien"; S.pqArt = b.dataset.art2; render(); window.scrollTo(0,0); });
  const o = document.getElementById("pqOtro"); if (o) o.onclick = () => { S.pqArt = null; render(); };
  view.querySelectorAll("[data-cli]").forEach(b => b.onclick = () => openClient(b.dataset.cli, S.pq === "artcli" ? "articulos" : "facturas", S.pq === "artcli" ? "uds" : null));
}

const APP_VERSION = "14/11/2026 · Líneas de texto sin ceros";
function viewCuenta(){
  const u = S.user || {};
  view.innerHTML = '<div class="acc"><div class="card"><h3>' + esc(u.nombre || "Tu cuenta") + '</h3><div class="count" style="margin:0">' + esc(u.email || "") + '</div></div>' +
    '<form class="card" id="pwForm"><h3>Cambiar contraseña</h3>' +
    '<label class="fld" for="pwOld">Contraseña actual<input id="pwOld" type="password" autocomplete="current-password" required></label>' +
    '<label class="fld" for="pwNew">Contraseña nueva (mínimo 8 caracteres)<input id="pwNew" type="password" autocomplete="new-password" minlength="8" required></label>' +
    '<label class="fld" for="pwNew2">Repite la contraseña nueva<input id="pwNew2" type="password" autocomplete="new-password" minlength="8" required></label>' +
    '<button class="btn" type="submit">Guardar contraseña</button><div class="msg" id="pwMsg" role="status"></div></form>' +
    '<div class="card"><button class="btn" id="logout" type="button" style="background:var(--slate)">Salir</button><div class="count" style="margin:8px 0 0">Versión de la app: ' + APP_VERSION + '</div></div></div>';
  document.getElementById("logout").onclick = () => auth.signOut();
  document.getElementById("pwForm").onsubmit = async ev => {
    ev.preventDefault();
    const m = document.getElementById("pwMsg"), o = document.getElementById("pwOld").value, n = document.getElementById("pwNew").value, n2 = document.getElementById("pwNew2").value;
    m.className = "msg";
    if (n !== n2){ m.className = "msg err"; m.textContent = "Las dos contraseñas nuevas no coinciden."; return; }
    if (n.length < 8){ m.className = "msg err"; m.textContent = "La contraseña nueva debe tener al menos 8 caracteres."; return; }
    m.textContent = "Guardando…";
    try {
      const cu = auth.currentUser;
      await cu.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(cu.email, o));
      await cu.updatePassword(n);
      m.className = "msg ok"; m.textContent = "Contraseña cambiada.";
      ev.target.reset();
    } catch(e){
      m.className = "msg err";
      m.textContent = /wrong-password|invalid-credential/.test(e.code || "") ? "La contraseña actual no es correcta." : (e.code === "auth/weak-password" ? "La contraseña nueva es demasiado débil." : "No se pudo cambiar (" + (e.code || "error") + ").");
    }
  };
}

function viewInicio(){
  const mine = S.data.all.filter(i => { const c = S.data.byCode.get(i.client); return c && c.com === S.com && i.date; });
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const sum = a => a.reduce((s,i) => s + i.total, 0);
  const pct = (cur, prev) => { if (!prev) return '<span class="dsub">sin datos del año anterior</span>'; const p = Math.round((cur - prev) / Math.abs(prev) * 100); return '<span class="' + (p >= 0 ? "up" : "down") + '">' + (p >= 0 ? "+" : "−") + num(Math.abs(p)) + ' %</span>'; };
  const curM = sum(mine.filter(i => i.date.getFullYear() === y && i.date.getMonth() === m));
  const prevM = sum(mine.filter(i => i.date.getFullYear() === y - 1 && i.date.getMonth() === m && i.date.getDate() <= d));
  const curY = sum(mine.filter(i => i.date.getFullYear() === y));
  const lim = new Date(y - 1, m, d, 23, 59);
  const prevY = sum(mine.filter(i => i.date.getFullYear() === y - 1 && i.date <= lim));
  const pl = mine.filter(i => i.pend > 0.004), pT = pl.reduce((s,i) => s + i.pend, 0), pG = pl.filter(i => i.giro).reduce((s,i) => s + i.pend, 0);
  const viejas = pl.filter(i => daysSince(i.date) > 60).length;
  const dorm = myClients().filter(c => c.last && daysSince(c.last) > DORM_DIAS).length;
  const last = mine.slice().sort((a,b) => b.date - a.date || b.num.localeCompare(a.num, "es", {numeric:true})).slice(0, 5);
  const mes = MESES[m];
  let h = '<div class="dash">';
  h += '<button class="dcard" type="button" data-go="mes"><div class="dlbl">Este mes · ' + mes + '</div><div class="dbig">' + eur(curM) + '</div><div class="dsub">' + mes + ' ' + (y - 1) + ' (hasta el día ' + d + '): ' + eur(prevM) + ' · ' + pct(curM, prevM) + '</div></button>';
  h += '<button class="dcard" type="button" data-go="anio"><div class="dlbl">Este año · ' + y + '</div><div class="dbig">' + eur(curY) + '</div><div class="dsub">' + (y - 1) + ' hasta el ' + d + '/' + (m + 1) + ': ' + eur(prevY) + ' · ' + pct(curY, prevY) + '</div></button>';
  h += '<button class="dcard wide pendc" type="button" data-go="pend"><div class="dlbl" style="color:var(--bad)">Pendiente de cobro</div><div class="dbig" style="color:var(--bad)">' + eur(pT) + '</div><div class="dsub">A reclamar: <b>' + eur(pT - pG) + '</b> · En giro: ' + eur(pG) + '</div><div class="dsub">' + pl.length + (pl.length === 1 ? ' factura' : ' facturas') + (viejas ? ' · <b style="color:var(--bad)">' + viejas + ' de más de 2 meses</b>' : '') + '</div></button>';
  h += '<button class="dcard wide" type="button" data-go="dorm"><div class="dlbl">Clientes sin comprar</div><div class="dbig">' + dorm + '</div><div class="dsub">llevan más de ' + DORM_DIAS + ' días sin factura · ver la lista ›</div></button>';
  h += '<div class="dcard lcard" style="cursor:default"><div class="dlbl">Últimas facturas</div><div class="dlist">' + (last.length ? last.map(i => { const c = S.data.byCode.get(i.client);
      return '<button class="drow" type="button" data-cli="' + esc(i.client) + '"><span class="dn">' + esc((c && c.name) || i.name) + (fisc(c) ? '<small class="dm">' + esc(fisc(c)) + '</small>' : '') + '</span><span class="dd">' + fdate(i.date) + '</span><span class="da">' + eur(i.total) + '</span></button>'; }).join("") : '<div class="dsub">Sin facturas.</div>') + '</div></div>';
  // Clientes que más deben: solo lo que hay que reclamar (sin giro bancario), de mayor a menor
  const deb = new Map();
  for (const i of pl){ if (i.giro) continue;
    const e = deb.get(i.client) || { code: i.client, name: i.name, t: 0, b: 0, n: 0, old: i.date };
    e.t += i.pend; e.b += i.total ? i.pend * i.base / i.total : 0; e.n++; if (i.date < e.old) e.old = i.date;
    deb.set(i.client, e); }
  const top = [...deb.values()].filter(e => e.t > 0.004).sort((a,b) => b.t - a.t).slice(0, 6);
  h += '<div class="dcard lcard" style="cursor:default"><div class="dlbl" style="color:var(--bad)">Clientes que más deben · a reclamar</div><div class="dlist">' + (top.length ? top.map(e => { const c = S.data.byCode.get(e.code);
      return '<button class="drow debrow" type="button" data-deb="' + esc(e.code) + '" data-y="' + e.old.getFullYear() + '"><span class="dn">' + esc((c && c.name) || e.name) +
        (fisc(c) ? '<small class="dm">' + esc(fisc(c)) + '</small>' : '') +
        '<small class="dm">' + e.n + (e.n === 1 ? ' factura' : ' facturas') + ' · la más antigua, hace ' + antig(e.old) + '</small></span>' +
        amt2(e.t, e.b, "bad") + '</button>'; }).join("") : '<div class="dsub">No hay nada pendiente de reclamar.</div>') + '</div></div>';
  h += '</div>';
  view.innerHTML = h;
  view.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const g = b.dataset.go;
    if (g === "mes"){ S.sec = "facturacion"; S.fpend = false; S.fyear = y; const k = y + "-" + m; S.fopen = new Set([k]); S.scrollMonth = k; }
    else if (g === "anio"){ S.sec = "facturacion"; S.fpend = false; S.fyear = y; }
    else if (g === "pend"){ S.sec = "facturacion"; S.fpend = true; }
    else if (g === "dorm"){ S.sec = "clientes"; S.client = null; S.cf = "dorm"; }
    render(); if (g !== "mes") window.scrollTo(0,0);
  });
  view.querySelectorAll("[data-cli]").forEach(b => b.onclick = () => { S.sec = "clientes"; S.client = b.dataset.cli; S.ctab = "facturas"; S.year = null; S.open = new Set(); S.scrollEnd = true; render(); });
  view.querySelectorAll("[data-deb]").forEach(b => b.onclick = () => { S.sec = "clientes"; S.client = b.dataset.deb; S.ctab = "facturas"; S.year = +b.dataset.y; S.open = new Set(); S.scrollEnd = true; render(); });
}

function render(){
  if (S.sec === "cuenta") return viewCuenta();
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.com === S.com));
  document.querySelectorAll("nav.bottom button").forEach(b => b.setAttribute("aria-selected", b.dataset.sec === S.sec));
  if (S.sec === "almacen") return viewAlmacen();
  if (!S.data) return;
  if (S.sec === "inicio") return viewInicio();
  if (S.sec === "preguntas") return viewPreguntas();
  if (S.sec === "facturacion") return viewFacturacion();
  S.client ? viewClient() : viewClients();
}

document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { if (!S.user || !S.user.admin || S.com === b.dataset.com) return; S.com = b.dataset.com; S.client = null; S.q = ""; S.fopen = new Set(); S.fopenInv = new Set(); try{ localStorage.setItem("iberlus_com", S.com); }catch(e){} render(); loadAll(); });
document.getElementById("userBtn").onclick = () => { S.sec = S.sec === "cuenta" ? "inicio" : "cuenta"; render(); window.scrollTo(0,0); };
view.addEventListener("click", e => { const b = e.target.closest("[data-dl]"); if (b) downloadInv(b.dataset.dl, b); });
document.querySelectorAll("nav.bottom button").forEach(b => b.onclick = () => { S.sec = b.dataset.sec; render(); window.scrollTo(0,0); });

const loginEl = document.getElementById("login"), appEl = document.getElementById("app"), lgMsg = document.getElementById("lgMsg");
document.getElementById("loginForm").onsubmit = async ev => {
  ev.preventDefault();
  const btn = document.getElementById("lgBtn"); btn.disabled = true; lgMsg.className = "msg"; lgMsg.textContent = "Entrando…";
  try { await auth.signInWithEmailAndPassword(document.getElementById("lgEmail").value.trim(), document.getElementById("lgPass").value); lgMsg.textContent = ""; }
  catch(e){
    const c = e.code || "";
    lgMsg.className = "msg err";
    lgMsg.textContent = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? "Email o contraseña incorrectos." : c === "auth/too-many-requests" ? "Demasiados intentos. Espera unos minutos y vuelve a probar." : c === "auth/network-request-failed" ? "Sin conexión a internet." : "No se pudo entrar (" + c + ").";
  }
  btn.disabled = false;
};
document.getElementById("lgForgot").onclick = async () => {
  const email = document.getElementById("lgEmail").value.trim();
  if (!email){ lgMsg.className = "msg err"; lgMsg.textContent = "Escribe primero tu email."; return; }
  try { await auth.sendPasswordResetEmail(email); lgMsg.className = "msg ok"; lgMsg.textContent = "Si el email existe, te llegará un correo para poner una contraseña nueva. Mira también en spam."; }
  catch(e){ lgMsg.className = "msg err"; lgMsg.textContent = "No se pudo enviar el correo (" + (e.code || "error") + ")."; }
};
auth.onAuthStateChanged(async u => {
  S.data = null; S.arts = null; S.artsErr = null; S.user = null; S.client = null; S.sec = "inicio";
  if (!u){ appEl.hidden = true; loginEl.hidden = false; return; }
  loginEl.hidden = true; appEl.hidden = false;
  view.innerHTML = '<div class="note"><b>Comprobando tu acceso…</b></div>';
  try {
    const p = await db.doc("usuarios/" + u.email.toLowerCase()).get();
    if (!p.exists){ view.innerHTML = '<div class="note err"><b>Tu usuario todavía no tiene acceso.</b><br>Avisa a Dani.<br><button class="btn" id="out" type="button">Salir</button></div>'; document.getElementById("out").onclick = () => auth.signOut(); return; }
    const d = p.data();
    S.user = { email: u.email, nombre: d.nombre || "", admin: !!d.admin };
    document.getElementById("adminBar").hidden = !S.user.admin;
    document.getElementById("userBtn").textContent = S.user.nombre || "Cuenta";
    if (!S.user.admin) S.com = str(d.comercial);
    loadMeta(); loadAll();
  } catch(e){
    view.innerHTML = '<div class="note err"><b>No se pudo comprobar tu acceso.</b><br>' + esc(fbErr(e)) + '<br><button class="btn" id="out" type="button">Salir</button></div>';
    document.getElementById("out").onclick = () => auth.signOut();
  }
});
})();
</script>
</body>
</html>
