<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E4068A">
<meta name="robots" content="noindex">
<title>Iberlus Comercial</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iberlus">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)} body{margin:0} [hidden]{display:none!important} img{max-width:100%}
/* Layout: app de móvil — cabecera fija, contenido en una columna (máx. 720px), barra inferior Clientes / Almacén */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#16213A; --muted:#5D6678; --line:#DDE2EA;
  --navy:#1F3864; --navy-ink:#FFFFFF; --slate:#44546A; --brand:#E4068A; --brand2:#00BFFF; --accent:var(--brand); --accent-soft:color-mix(in srgb,var(--brand) 9%,#FFFFFF); --on-accent:#FFFFFF;
  --good:#1E7B4E; --warn:#A35C00; --bad:#B42318; --chip:#EEF1F6; --open:#FBFCFE; --giro:#1D5FB8; --giro-soft:#E6EFFB;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#162034; --ink:#E6EBF4; --muted:#98A2B6; --line:#26324A;
  --navy:#1B2D52; --navy-ink:#E6EBF4; --slate:#30405C; --accent:color-mix(in srgb,var(--brand) 45%,#FFFFFF); --accent-soft:color-mix(in srgb,var(--brand) 30%,#162034); --on-accent:#0E1420;
  --good:#5CC290; --warn:#E3A24A; --bad:#F2877D; --chip:#1E2A42; --open:#1C2840; --giro:#8DB8F2; --giro-soft:#1C2C4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#162034; --ink:#E6EBF4; --muted:#98A2B6; --line:#26324A;
  --navy:#1B2D52; --navy-ink:#E6EBF4; --slate:#30405C; --accent:color-mix(in srgb,var(--brand) 45%,#FFFFFF); --accent-soft:color-mix(in srgb,var(--brand) 30%,#162034); --on-accent:#0E1420;
  --good:#5CC290; --warn:#E3A24A; --bad:#F2877D; --chip:#1E2A42; --open:#1C2840; --giro:#8DB8F2; --giro-soft:#1C2C4A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--ink);border-bottom:3px solid var(--accent)}
header.top .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.01em}
.brand h1 span{font-weight:600;color:var(--brand2)}
.brand h1 b{color:var(--accent)}
.brandid{display:flex;align-items:center;gap:10px}
.logo{display:inline-flex;background:#FFFFFF;border-radius:8px;padding:3px 6px}
.logo img{height:46px;width:auto;display:block}
.stamp{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.proto{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.proto .tag{text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.75}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
main{padding-block:14px 96px}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;min-width:0;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.count{font-size:12px;color:var(--muted);margin:0 0 8px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .right{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--muted);flex:none}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--accent);font-weight:600;padding:4px 0;cursor:pointer;margin-bottom:6px}
.client-head h2{margin:0;font-family:var(--f-display);font-size:21px;line-height:1.2;text-wrap:balance}
.client-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin:14px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.years{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.inv{border-top:1px solid var(--line)}
.inv:first-child{border-top:0}
.inv>button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:0;background:transparent;cursor:pointer;text-align:left}
@media (hover:hover){.inv>button:hover{background:var(--accent-soft)}}
.inv .num{font-weight:600;font-variant-numeric:tabular-nums}
.inv .date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.inv .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.inv .neg{color:var(--bad)}
.inv .chev{transition:transform .15s}
.inv[open-state="1"] .chev{transform:rotate(90deg)}
.lines{background:var(--bg);padding:4px 14px 10px;display:flex;flex-direction:column}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:7px 0;border-top:1px dashed var(--line);font-size:12.5px}
.ln:first-child{border-top:0}
.ln .d{min-width:0;overflow-wrap:anywhere}
.ln .c{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ln .p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln .p b{font-weight:700}
.ln .p s{color:var(--muted)}
.ln .q{text-align:right;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.dto{display:inline-block;background:var(--chip);border-radius:4px;padding:0 5px;margin:0 4px;font-size:11px;color:var(--muted)}
.art .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stock{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;text-align:right;min-width:56px}
.stock small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted)}
.stock.zero{color:var(--warn)} .stock.neg{color:var(--bad)}
.alm{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.alm b{font-weight:700;color:var(--ink,inherit)} .alm .neg, .alm .neg b{color:var(--bad)}
.row.artrow{cursor:pointer}
.row.artrow.open{background:var(--accent-soft)}
.hist{background:var(--bg);padding:6px 14px 10px;border-top:1px solid var(--line);border-left:3px solid var(--brand)}
.hist .hh{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand2);margin:6px 0 2px}
.hist .hh span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);margin-left:6px}
.hl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--line);font-size:12px;line-height:1.35}
.hh + .hl{border-top:0}
.hl .w{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hl .pr{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.hl .m{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.hl .pr2{text-align:right;color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hist .none{font-size:12px;color:var(--muted);padding:3px 0}
.hist .linkbtn{font-size:12px;margin-top:2px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:14px}
.note b{color:var(--ink)}
.note.err{border-color:var(--bad)}
.note button{margin-top:10px}
.btn{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer}
.progress{display:flex;flex-direction:column;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
.progress div{display:flex;justify-content:space-between;gap:12px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .wrap{display:flex}
nav.bottom button{flex:1;border:0;background:transparent;padding:12px 8px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-selected="true"]{color:var(--accent)}
.amt2{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;line-height:1.25}
.amt2 b{display:block;font-weight:700}
.amt2 small{display:block;font-size:11.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.pend{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.par{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.mute{color:var(--muted);background:var(--chip)}
.fwrap{border-top:1px solid var(--line);scroll-margin-bottom:96px}
.fwrap:first-child{border-top:0}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 14px;font-size:13px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;font-family:inherit;color:inherit}
@media (hover:hover){.frow:hover{background:var(--accent-soft)}}
.inv{scroll-margin-bottom:96px}
.mcol{display:flex;flex-direction:column;min-width:96px}
.yoy{font-size:11.5px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.yoy .up{color:var(--good);font-weight:600} .yoy .down{color:var(--bad);font-weight:600}
.pill.giro{color:var(--giro);background:var(--giro-soft)}
.fwrap.open,.inv[open-state="1"]{position:relative}
.fwrap.open::before,.inv[open-state="1"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);z-index:1;pointer-events:none}
.fwrap.open .lines{background:var(--open)}
.inv .ident{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0;flex:1}
.age{font-weight:600;color:var(--warn)} .age.old{color:var(--bad)} .age.mute{color:var(--muted);font-weight:500}
.frow .who{font-weight:600;min-width:0;overflow-wrap:anywhere}
.frow .meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.frow .amt2{grid-row:span 2;align-self:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .sp{flex:1}
.pendbtn{border:1px solid var(--bad);color:var(--bad);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;cursor:pointer}
.pendbtn[aria-pressed="true"]{background:var(--bad);color:var(--on-accent)}
.sumbox{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;flex-wrap:wrap}
.sumbox .big{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sumbox .lbl{font-size:12px;color:var(--brand2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.month>button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:0;background:transparent;cursor:pointer;text-align:left}
@media (hover:hover){.month>button:hover{background:var(--accent-soft)}}
.month{border-top:1px solid var(--line)} .month:first-child{border-top:0}
.month .mname{font-weight:600;text-transform:capitalize;min-width:84px}
.month .chev{transition:transform .15s} .month[open-state="1"] .chev{transform:rotate(90deg)}
.month .inner{background:var(--bg)}
.pendline{margin-top:8px;font-size:13.5px;color:var(--bad)} .pendline b{font-variant-numeric:tabular-nums}
.pendline.ok{color:var(--good)}
.pendsum{width:100%;cursor:pointer;font:inherit;color:inherit;text-align:left}
.pendsum:hover{border-color:var(--bad)}
.dlrow{display:flex;justify-content:flex-end;padding-top:8px}
.btn.dl{font-size:13px;padding:7px 12px}
.btn.dl:disabled{opacity:.6;cursor:default}
.month>button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 10px}
.mcol{min-width:0}
.mname{white-space:nowrap}
.mcount{font-weight:500;color:var(--muted);font-size:12.5px;text-transform:none}
.yoy{white-space:normal}
.amt2 b,.amt2 small{white-space:nowrap}
.inv .num,.inv .date{white-space:nowrap}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px;min-width:0}
.dcard:hover{border-color:var(--accent)}
.dcard.wide{grid-column:1/-1}
.dlbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--brand2)}
.dbig{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dsub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dsub .up,.dcard .up{color:var(--good);font-weight:600} .dsub .down,.dcard .down{color:var(--bad);font-weight:600}
.dlist{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:baseline;padding:8px 0;border:0;border-top:1px solid var(--line);background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;font-size:13px}
.drow:first-child{border-top:0}
.drow .dn{font-weight:600;overflow-wrap:anywhere}
.drow .dd{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.drow .da{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.drow.debrow{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.drow .dm{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}
.amt2.bad b{color:var(--bad)}
@media (max-width:640px){.dcard.lcard{grid-column:1/-1}}
@media (max-width:360px){.dash{grid-template-columns:1fr}}
@media (max-width:440px){nav.bottom button{padding:10px 2px;font-size:11.5px}}
@media (max-width:440px){
  body{font-size:14px}
  .mname{font-size:14.5px} .mcount{font-size:11.5px}
  .yoy{font-size:11px}
  .amt2 b{font-size:14px} .amt2 small{font-size:11px}
  .month>button,.inv>button,.frow{padding-left:10px;padding-right:10px;gap:2px 8px}
  .frow{font-size:12.5px}
}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login .lg{display:flex;justify-content:center;margin-bottom:4px}
.login .lg img{height:70px;background:#FFFFFF;border-radius:10px;padding:4px 8px}
.login h2{margin:0;text-align:center;font-family:var(--f-display);font-size:20px}
.login p{margin:0;text-align:center;color:var(--muted);font-size:13px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.fld input{font:inherit;font-weight:400;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.fld input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn.wide{width:100%;padding:12px;font-size:15px}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;padding:4px;font-size:13px}
.msg{font-size:13px;text-align:center;min-height:1em}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.userbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.acc{display:flex;flex-direction:column;gap:12px}
.acc .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.acc h3{margin:0;font-family:var(--f-display);font-size:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pcard h3{margin:0;font-family:var(--f-display);font-size:16px}
.pcard textarea{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;min-height:70px}
.pcard textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.sugrow{border-top:1px solid var(--line);padding-top:8px;font-size:13.5px}
.client-head p{white-space:normal}
.ns{display:none}
@media (max-width:480px){nav.bottom button{padding:10px 1px;font-size:11px;min-width:0} nav.bottom .nl{display:none} nav.bottom .ns{display:inline}}
@media (max-width:380px){nav.bottom button{font-size:10.5px}}
.pe-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pe-date{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.pe-date input,.in,.pe-grid input{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.pe-date input{width:auto;padding:6px 8px;font-size:14px}
.in:focus,.pe-date input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.in.mono{font-family:var(--f-mono);text-transform:uppercase}
.pe-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pe-grid .fld:first-child{grid-column:1/-1}
.pe-sel{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:10px 12px}

  const now = today0(), a = new Date(d); a.setHours(0,0,0,0);
  const days = Math.max(0, Math.round((now - a) / 864e5));

function brandFrom(img){
  const w = Math.min(img.naturalWidth, 220), h = Math.max(1, Math.round(img.naturalHeight * w / img.naturalWidth));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data, b = new Map();
  for (let i = 0; i < d.length; i += 4){
    const r = d[i], g = d[i+1], bl = d[i+2];
    if (d[i+3] < 200 || Math.max(r,g,bl) - Math.min(r,g,bl) < 40) continue;
    const k = (r>>4) + "," + (g>>4) + "," + (bl>>4), e = b.get(k) || {n:0,r:0,g:0,b:0};
    e.n++; e.r += r; e.g += g; e.b += bl; b.set(k, e);
  }
  let best = null; for (const e of b.values()) if (!best || e.n > best.n) best = e;
  if (!best || best.n < 20) return null;
  let r = best.r/best.n, g = best.g/best.n, bb = best.b/best.n;

// Listado de pendientes a reclamar (sin giro) en PDF, agrupado por cliente (el que más debe, primero)
function listadoPendientes(btn){
  if (!S.data || btn.disabled) return;
  const old = btn.textContent; btn.disabled = true; btn.textContent = "Generando…";
  const done = msg => { btn.textContent = msg; setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2500); };
  try {
    const R = window.FACTURA_RES;
    if (!window.jspdf || !R) return done("No disponible");
    const pl = S.data.all.filter(i => { const c = S.data.byCode.get(i.client); return c && c.com === S.com && i.date && i.pend > 0.004 && !i.giro; });
    if (!pl.length) return done("Nada a reclamar");
    const sinIva = i => i.total ? i.pend * i.base / i.total : 0;
    const groups = new Map();
    for (const i of pl){ const g = groups.get(i.client) || { code: i.client, name: ((S.data.byCode.get(i.client) || {}).name) || i.name, inv: [], t: 0, b: 0 };
      g.inv.push(i); g.t += i.pend; g.b += sinIva(i); groups.set(i.client, g); }
    const gl = [...groups.values()].sort((a,b) => b.t - a.t);
    gl.forEach(g => g.inv.sort((a,b) => a.date - b.date || a.num.localeCompare(b.num, "es", {numeric:true})));
    const totT = gl.reduce((s,g) => s + g.t, 0), totB = gl.reduce((s,g) => s + g.b, 0);
    const money = n => { const v = Number(n) || 0, p = Math.abs(v).toFixed(2).split("."); return (v < 0 ? "-" : "") + grp(p[0]) + "," + p[1] + " €"; };
    const comBtn = document.querySelector('[data-com="' + S.com + '"]');
    const comLabel = (S.user && !S.user.admin && S.user.nombre) ? S.user.nombre : (comBtn ? comBtn.textContent.trim() : "Comercial " + S.com);

    const doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4", compress: true });
    doc.addFileToVFS("Carlito.ttf", R.carlito); doc.addFont("Carlito.ttf", "Calibri", "normal");
    doc.addFileToVFS("CarlitoB.ttf", R.carlitoBold); doc.addFont("CarlitoB.ttf", "Calibri", "bold");
    doc.setProperties({ title: "Pendientes de cobro - " + comLabel, author: "Iberlus Distribución Doméstica, S.L." });
    const PINK = [228, 6, 138], BLUE = [0, 191, 255], RED = [192, 0, 0], GREY = [90, 90, 90], BLACK = [0, 0, 0], LIGHT = [242, 242, 242];
    const W = 595.28, H = 841.89, L = 36, Rm = W - 36;
    const font = (sz, bold, col) => { doc.setFont("Calibri", bold ? "bold" : "normal"); doc.setFontSize(sz); doc.setTextColor(...(col || BLACK)); };
    const fit = (txt, w) => { txt = String(txt || ""); if (doc.getTextWidth(txt) <= w) return txt; while (txt.length > 1 && doc.getTextWidth(txt + "…") > w) txt = txt.slice(0, -1); return txt + "…"; };
    // columnas: factura, fecha, días, forma de pago, pendiente con IVA, sin IVA
    const C = { fac: L + 14, fec: L + 92, dias: L + 175, fp: L + 225, con: Rm - 92, sin: Rm - 6 };
    const now = new Date();
    const head = first => {
      let y = 34;
      if (first){
        if (R.logo) doc.addImage(R.logo, R.logoFmt || "JPEG", L, y - 6, 84, 60);
        font(18, true, PINK); doc.text("Pendientes de cobro", Rm, y + 12, { align: "right" });

        y += 72;
        doc.setFillColor(...LIGHT); doc.roundedRect(L, y, Rm - L, 46, 4, 4, "F");

        y += 62;

      return y + 18;
    };
    let y = head(true);
    const BOTTOM = H - 46, ROW = 15;
    const newPage = () => { doc.addPage(); y = head(false); };
    for (const g of gl){
      font(10.5, true, BLACK);
      const tTxt = money(g.t);

      const nl = doc.splitTextToSize(g.name + "  (" + g.code + ")", nameW).slice(0, 2);
      const gh = 18 + (nl.length - 1) * 12;

      font(9.5, false, GREY); doc.text(money(g.b), C.sin, y + 12.5, { align: "right" });
      y += gh;
      for (const i of g.inv){
        if (y + ROW > BOTTOM){ newPage(); font(9.5, true, GREY); doc.text(fit(g.name + " (sigue)", Rm - L - 16), L + 8, y + 11); y += ROW; }
        const d = daysSince(i.date);

        font(9.5, false, BLACK); doc.text(fit((i.fp || "") + (i.st === "par" ? " · parcial" : ""), C.con - 70 - C.fp), C.fp, y + 11);
        doc.text(money(i.pend), C.con, y + 11, { align: "right" });
        font(9.5, false, GREY); doc.text(money(sinIva(i)), C.sin, y + 11, { align: "right" });
        doc.setDrawColor(225); doc.line(L + 8, y + ROW, Rm, y + ROW);
        y += ROW;
      }
    }
    if (y + 26 > BOTTOM) newPage();
    y += 8; doc.setDrawColor(...PINK); doc.setLineWidth(1); doc.line(L, y, Rm, y); doc.setLineWidth(0.5);
    font(11, true, BLACK); doc.text("TOTAL A RECLAMAR", L + 8, y + 16);

    font(10, true, GREY); doc.text(money(totB), C.sin, y + 16, { align: "right" });
    const pages = doc.getNumberOfPages();
    for (let p = 1; p <= pages; p++){ doc.setPage(p); font(8.5, false, GREY);
      doc.text("Iberlus Distribución Doméstica, S.L. · Días = días desde la fecha de la factura (en rojo, más de 60)", L, H - 24);
      doc.text("Página " + p + " de " + pages, Rm, H - 24, { align: "right" }); }
    const d0 = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
    const name = ("Pendientes_cobro_" + comLabel.replace(/\(.*?\)/g, "") + "_" + d0).replace(/\s+/g, "_").replace(/[^A-Za-z0-9_.\-]/g, "").replace(/_+/g, "_") + ".pdf";
    const url = URL.createObjectURL(doc.output("blob")), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    done("Descargado");
  } catch(e){ done("No se pudo generar"); }
}

// Historial del artículo en Almacén: compras (solo admin, sea cual sea el comercial elegido) y ventas a los clientes del comercial
const HIST_C = 3, HIST_V = 5;
function histPrice(price, dto){ const neto = price * (1 - (dto || 0) / 100);
  return { main: eur(neto), sub: dto ? eur(price) + ' −' + num(dto) + ' %' : '' }; }
function histLine(who, meta, price, dto){ const p = histPrice(price, dto);
  return '<div class="hl"><span class="w">' + who + '</span><span class="pr">' + p.main + '</span><span class="m">' + meta + '</span><span class="pr2">' + p.sub + '</span></div>'; }
function histHtml(code){
  const C = String(code).toUpperCase();

    h += '<div class="hh">Compras<span>solo tú</span></div>';

    else if (!S.compras){ h += '<div class="none">Cargando compras…</div>'; loadCompras(); }
    else {
      const cl = S.compras.get(C) || [];
      const show = S.hmore.c ? cl : cl.slice(0, HIST_C);
      h += cl.length ? show.map(e => histLine(esc(e[0]), fdate(dIso(e[1])) + ' · ' + num(e[2]) + ' uds', +e[3] || 0, +e[4] || 0)).join("") : '<div class="none">Sin compras desde el 01/01/2025.</div>';
      if (cl.length > show.length) h += '<button class="linkbtn" type="button" data-hmore="c">ver todas (' + cl.length + ')</button>';
    }
  }
  h += '<div class="hh">Ventas' + (S.user && S.user.admin ? '<span>clientes de ' + esc(comName()) + '</span>' : '') + '</div>';
  if (!S.data) h += '<div class="none">Cargando clientes…</div>';
  else {
    const m = new Map();
    S.data.all.forEach(i => { if (!i.date) return; i.lines.forEach(l => { if (String(l.code).toUpperCase() !== C || l.qty <= 0) return;
      const e = m.get(i.client); if (!e || i.date >= e.date) m.set(i.client, { code: i.client, date: i.date, qty: l.qty, price: l.price, dto: l.dto }); }); });
    const vl = [...m.values()].sort((a,b) => b.date - a.date);
    const show = S.hmore.v ? vl : vl.slice(0, HIST_V);
    h += vl.length ? show.map(e => { const c = S.data.byCode.get(e.code); return histLine(esc((c && c.name) || e.code), fdate(e.date) + ' · ' + num(e.qty) + ' uds', e.price, e.dto); }).join("") : '<div class="none">Ningún cliente lo ha comprado.</div>';
    if (vl.length > show.length) h += '<button class="linkbtn" type="button" data-hmore="v">ver todas (' + vl.length + ')</button>';
  }
  return h + '</div>';
}

function almHtml(a){
  if (a.red === null) return '';
  const v = (n, x) => '<span' + (x < 0 ? ' class="neg"' : '') + '>' + n + ' <b>' + num(x) + '</b></span>';
  return '<div class="alm">' + v('Redondela', a.red) + ' · ' + v('Tienda Vigo', a.tda) + '</div>';
}
function viewAlmacen(){
  if (!S.user) return;
  if (!S.arts){
    if (S.artsErr){ view.innerHTML = '<div class="note err"><b>No se ha podido leer el almacén.</b><br>' + esc(S.artsErr) + '<br><button class="btn" id="retryA" type="button">Reintentar</button></div>';
      document.getElementById("retryA").onclick = () => { S.artsErr = null; loadArts(); }; return; }
    view.innerHTML = '<div class="note"><b>Leyendo artículos y stock…</b><br>Son unos 22.000 artículos; tarda unos segundos.</div>';
    loadArts(); return;
  }
  const q = norm(S.qa); const words = q.split(/\s+/).filter(Boolean);
  const list = words.length ? S.arts.filter(a => words.every(w => a.k.includes(w))) : [];
  let h = '<div class="search"><input id="qa" type="search" placeholder="Buscar artículo por código o descripción" value="' + esc(S.qa) + '" autocomplete="off" aria-label="Buscar artículo"></div>';
  if (!words.length) h += '<div class="note">Escribe un código o parte de la descripción (por ejemplo <b>copa vino</b> o <b>H23820</b>) para ver el stock actual.</div>';
  else {
    h += '<p class="count">' + list.length.toLocaleString("es-ES") + ' artículos' + (list.length > 100 ? ' · se muestran los 100 primeros' : '') + '</p>';
    h += '<div class="list">' + (list.length ? list.slice(0,100).map(a => { const o = S.artOpen === a.code;
      return '<div class="row artrow' + (o ? ' open' : '') + '" role="button" tabindex="0" aria-expanded="' + o + '" data-artopen="' + esc(a.code) + '"><div class="main"><div class="name" style="white-space:normal">' + esc(a.desc) + '</div><div class="sub" style="font-family:var(--f-mono)">' + esc(a.code) + '</div>' + almHtml(a) + '</div>' +
      '<div class="stock' + (a.stock < 0 ? " neg" : a.stock === 0 ? " zero" : "") + '">' + num(a.stock) + '<small>en stock</small></div></div>' + (o ? histHtml(a.code) : ''); }).join("") : '<div class="empty">Ningún artículo coincide.</div>') + '</div>';
  }
  view.innerHTML = h;
  view.querySelectorAll("[data-artopen]").forEach(r => { const go = () => { const c = r.dataset.artopen; S.artOpen = S.artOpen === c ? null : c; S.hmore = {}; viewAlmacen(); };
    r.onclick = go; r.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } }; });
  view.querySelectorAll("[data-hmore]").forEach(b => b.onclick = e => { e.stopPropagation(); S.hmore[b.dataset.hmore] = true; viewAlmacen(); });
  const inp = document.getElementById("qa");
  let t; inp.oninput = () => { clearTimeout(t); t = setTimeout(() => { S.qa = inp.value; const pos = inp.selectionStart; viewAlmacen(); const n = document.getElementById("qa"); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }, 180); };
}

function viewFacturacion(){
  if (!S.data) return;
  const mine = S.data.all.filter(i => { const c = S.data.byCode.get(i.client); return c && c.com === S.com && i.date; });
  const asc = (a,b) => a.date - b.date || a.num.localeCompare(b.num, "es", {numeric:true});
  const who = i => { const c = S.data.byCode.get(i.client); return esc((c && c.name) || i.name); };
  const linesOf = i => '<div class="lines">' + (i.lines.length ? i.lines.map(lineHtml).join("") : '<div class="empty">Sin líneas</div>') + dlBtn(i) + '</div>';
  const frow = i => { const o = S.fopenInv.has(i.key);
    return '<div class="fwrap' + (o ? ' open' : '') + '"><button type="button" class="frow" data-finv="' + esc(i.key) + '" aria-expanded="' + o + '"><span class="who">' + who(i) + '</span>' +
      amt2(i.total, i.base, i.total < 0 ? "neg" : "").replace('<div class="amt2', '<span class="amt2').replace(/<\/div>$/, '</span>') +
      '<span class="meta">' + esc(invNum(i)) + ' · ' + fdate(i.date) + ' ' + pill(i) + '</span></button>' + (o ? linesOf(i) : '') + '</div>'; };
  const prow = i => { const o = S.fopenInv.has(i.key);
    const age = '<span class="age' + (i.giro ? " mute" : daysSince(i.date) > 60 ? " old" : "") + '">' + antig(i.date) + '</span>';
    return '<div class="fwrap' + (o ? ' open' : '') + '"><button type="button" class="frow" data-finv="' + esc(i.key) + '" aria-expanded="' + o + '"><span class="who">' + who(i) + '</span>' +
      '<span class="amt2"><b>' + eur(i.pend) + '</b><small>de ' + eur(i.total) + '</small></span>' +
      '<span class="meta">' + esc(invNum(i)) + ' · ' + fdate(i.date) + ' · ' + age + (i.giro ? ' <span class="pill giro">Giro bancario</span>' : (i.fp ? ' · ' + esc(i.fp) : '')) + (i.st === "par" ? ' ' + pill(i, true) : '') + '</span></button>' + (o ? linesOf(i) : '') + '</div>'; };
  let h = '';
  if (S.fpend){
    const pl = mine.filter(i => i.pend > 0.004).sort(asc);
    const tot = pl.reduce((s,i) => s + i.pend, 0), gir = pl.filter(i => i.giro).reduce((s,i) => s + i.pend, 0);
    h += '<div class="toolbar"><button class="btn dl" id="lpdf" type="button">Listado (PDF)</button><span class="sp"></span><button class="pendbtn" id="fp" type="button" aria-pressed="true">Pendientes de cobro</button></div>';
    h += '<div class="sumbox"><div><div class="lbl">Pendiente de cobro (con IVA)</div><div class="big">' + eur(tot) + '</div></div><div class="count" style="margin:0;text-align:right">A reclamar: <b style="color:var(--bad)">' + eur(tot - gir) + '</b><br>En giro bancario: ' + eur(gir) + '<br>' + pl.length + ' facturas · la última, abajo</div></div>';
    h += '<div class="list">' + (pl.length ? pl.map(prow).join("") : '<div class="empty">No hay facturas pendientes de cobro.</div>') + '</div>';
  } else {
    const years = [...new Set(mine.map(i => i.date.getFullYear()))].sort((a,b) => b - a);
    if (!S.fyear || !years.includes(S.fyear)) S.fyear = years[0];
    h += '<div class="toolbar">' + years.map(y => '<button class="chipbtn" type="button" data-fy="' + y + '" aria-pressed="' + (y === S.fyear) + '">' + y + '</button>').join("") +
         '<span class="sp"></span><button class="pendbtn" id="fp" type="button" aria-pressed="false">Pendientes de cobro</button></div>';
    const yl = mine.filter(i => i.date.getFullYear() === S.fyear);
    const tot = yl.reduce((s,i) => s + i.total, 0), totB = yl.reduce((s,i) => s + i.base, 0);
    h += '<div class="sumbox"><div><div class="lbl">Facturado ' + (S.fyear || "") + ' (con IVA)</div><div class="big">' + eur(tot) + '</div></div><div class="count" style="margin:0">' + eur(totB) + ' sin IVA · ' + yl.length + ' facturas</div></div>';
    const pAll = mine.filter(i => i.pend > 0.004), pT = pAll.reduce((s,i) => s + i.pend, 0);
    h += '<button class="sumbox pendsum" id="fp2" type="button"><div><div class="lbl" style="color:var(--bad)">Pendiente de cobro (con IVA)</div><div class="big" style="color:var(--bad)">' + eur(pT) + '</div></div><div class="count" style="margin:0">' + pAll.length + ' facturas · ver pendientes ›</div></button>';
    if (!yl.length) h += '<div class="list"><div class="empty">Sin facturas.</div></div>';
    else {
      h += '<div class="list">';
      for (let m = 0; m < 12; m++){
        const ml = yl.filter(i => i.date.getMonth() === m).sort(asc);
        if (!ml.length) continue;
        const k = S.fyear + "-" + m, o = S.fopen.has(k);
        const cur = ml.reduce((s,i) => s + i.total, 0);
        const pm = ml.filter(i => i.pend > 0.004), pmT = pm.reduce((s,i) => s + i.pend, 0);
        const prev = mine.filter(i => i.date.getFullYear() === S.fyear - 1 && i.date.getMonth() === m).reduce((s,i) => s + i.total, 0);
        let yoy = (S.fyear - 1) + ': ';
        if (prev){ const pc = (cur - prev) / Math.abs(prev) * 100; yoy += eur(prev) + ' · <span class="' + (pc >= 0 ? "up" : "down") + '">' + (pc >= 0 ? "+" : "−") + num(Math.abs(Math.round(pc))) + '\u00a0%</span>'; }
        else yoy += 'sin facturas';
        h += '<div class="month" data-mk="' + k + '" open-state="' + (o?1:0) + '"><button type="button" data-fm="' + k + '" aria-expanded="' + o + '">' + chev +
             '<span class="mcol"><span class="mname">' + MESES[m] + ' <span class="mcount">·\u00a0' + ml.length + (ml.length === 1 ? '\u00a0fra.' : '\u00a0fras.') + '</span></span><span class="yoy">' + yoy + '</span>' + (pm.length ? '<span class="yoy" style="color:var(--bad);font-weight:600">Pendiente: ' + eur(pmT) + ' · ' + pm.length + (pm.length === 1 ? '\u00a0fra.' : '\u00a0fras.') + '</span>' : '') + '</span>' +
             amt2(cur, ml.reduce((s,i) => s + i.base, 0)) + '</button>' +
             (o ? '<div class="inner">' + ml.map(frow).join("") + '</div>' : '') + '</div>';
      }
      h += '</div>';
    }
  }
  view.innerHTML = h;
  document.getElementById("fp").onclick = () => { S.fpend = !S.fpend; render(); };
  const lp = document.getElementById("lpdf"); if (lp) lp.onclick = () => listadoPendientes(lp);
  const fp2 = document.getElementById("fp2"); if (fp2) fp2.onclick = () => { S.fpend = true; render(); window.scrollTo(0,0); };
  view.querySelectorAll("[data-fy]").forEach(b => b.onclick = () => { S.fyear = +b.dataset.fy; S.fopen = new Set(); render(); });
  view.querySelectorAll("[data-fm]").forEach(b => b.onclick = () => { const k = b.dataset.fm; if (S.fopen.has(k)) S.fopen.delete(k); else { S.fopen.add(k); S.scrollMonth = k; } render(); });
  view.querySelectorAll("[data-finv]").forEach(b => b.onclick = () => { const k = b.dataset.finv; S.fopenInv.has(k) ? S.fopenInv.delete(k) : S.fopenInv.add(k); render(); });
  if (S.scrollMonth){
    const mk = S.scrollMonth; S.scrollMonth = null;
    const box = view.querySelector('[data-mk="' + mk + '"]'), ws = box ? box.querySelectorAll(".fwrap") : [], last = ws[ws.length - 1];
    if (last) requestAnimationFrame(() => last.scrollIntoView({ block: "end" }));
  }
}

/* ---------- Preguntas ---------- */
const PREGUNTAS = [
  { id: "artcli", t: "¿Qué artículos compra más un cliente?", d: "Eliges el cliente y ves sus artículos, de más a menos unidades." },
  { id: "topcli", t: "¿Qué clientes me compran más?", d: "Por importe facturado en el año, con IVA." },
  { id: "freq",   t: "¿Qué clientes me compran más a menudo?", d: "Por número de facturas en el año y cada cuántos días compran." },
  { id: "quien",  t: "¿Quién compra este artículo?", d: "Eliges el artículo y ves qué clientes lo compran, con el último precio." },
  { id: "topart", t: "¿Qué he vendido más?", d: "Artículos más vendidos este mes, este año o el año pasado." },
  { id: "baja",   t: "¿Qué clientes compran menos que el año pasado?", d: "Mismo periodo del año pasado frente a este año, hasta hoy." }
];
const pqBack = () => '<button class="back" type="button" id="pqBack"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Preguntas</button>';
const pqTitle = id => '<div class="client-head"><h2>' + esc((PREGUNTAS.find(p => p.id === id) || {}).t || "") + '</h2></div>';
const openClient = (code, tab, sort) => { S.client = code; S.ctab = tab || "facturas"; if (sort) S.asort = sort; S.year = null; S.open = new Set(); S.sec = "clientes"; S.scrollEnd = tab !== "articulos"; render(); if (tab === "articulos") window.scrollTo(0,0); };
function pqYears(){ return [...new Set(S.data.all.filter(i => i.date).map(i => i.date.getFullYear()))].sort((a,b) => b - a); }
function pqChips(opts, cur, attr){ return '<div class="years">' + opts.map(o => '<button class="chipbtn" type="button" ' + attr + '="' + esc(o[0]) + '" aria-pressed="' + (String(o[0]) === String(cur)) + '">' + esc(o[1]) + '</button>').join("") + '</div>'; }
function pqRow(name, sub, right, attrs){ return '<button class="row" type="button" ' + (attrs || "") + '><div class="main"><div class="name" style="white-space:normal">' + name + '</div><div class="sub" style="white-space:normal">' + sub + '</div></div><div class="right" style="color:var(--ink)">' + right + '</div>' + chev + '</button>'; }
function priceHtml(price, dto){ const neto = price * (1 - dto / 100); return dto ? '<s style="color:var(--muted)">' + eur(price) + '</s><br><span class="dto">−' + num(dto) + ' %</span><b>' + eur(neto) + '</b>' : '<b>' + eur(price) + '</b>'; }

function viewPreguntas(){
  if (!S.pq){
    let h = '<div class="client-head"><h2>Preguntas</h2><p>Elige una pregunta. Las respuestas salen de tus datos de Factusol.</p></div><div class="list" style="margin-top:12px">' +
      PREGUNTAS.map(p => pqRow(esc(p.t), esc(p.d), "", 'data-pq="' + p.id + '"')).join("") + '</div>';
    h += '<div class="pcard"><h3>¿Echas en falta alguna pregunta?</h3><p class="count" style="margin:0">Díselo a Dani y la añadimos.</p></div>';
    view.innerHTML = h;
    view.querySelectorAll("[data-pq]").forEach(b => b.onclick = () => { S.pq = b.dataset.pq; S.pqQ = ""; S.pqArt = null; render(); window.scrollTo(0,0); });
    return;
  }
  const id = S.pq; let h = pqBack() + pqTitle(id);
  const all = S.data.all.filter(i => i.date), years = pqYears();
  if (!S.pqYear || !years.includes(S.pqYear)) S.pqYear = years[0];
  const nameOf = code => { const c = S.data.byCode.get(code); return c ? c.name : code; };

  if (id === "artcli"){
    const q = norm(S.pqQ || "");
    const list = S.data.clients.filter(c => c.nInv && (!q || norm(c.name + " " + c.fiscal + " " + c.code + " " + c.pob).includes(q))).sort((a,b) => a.name.localeCompare(b.name, "es")).slice(0, 60);
    h += '<div class="search"><input id="pqq" type="search" placeholder="Busca el cliente" value="' + esc(S.pqQ || "") + '" autocomplete="off" aria-label="Buscar cliente"></div>';
    h += '<div class="list">' + (list.length ? list.map(c => pqRow(esc(c.name), esc([fisc(c), c.code, c.pob].filter(Boolean).join(" · ")), "", 'data-cli="' + esc(c.code) + '"')).join("") : '<div class="empty">Ningún cliente coincide.</div>') + '</div>';
  }
  else if (id === "topcli" || id === "freq"){
    h += pqChips(years.map(y => [y, String(y)]), S.pqYear, "data-py");
    const m = new Map();
    all.filter(i => i.date.getFullYear() === S.pqYear).forEach(i => { const e = m.get(i.client) || { code: i.client, tot: 0, n: 0, dates: [] }; e.tot += i.total; e.n++; e.dates.push(+i.date); m.set(i.client, e); });
    let rows = [...m.values()];
    rows.forEach(e => { const d = [...new Set(e.dates)].sort((a,b) => a - b); e.every = d.length > 1 ? Math.round((d[d.length-1] - d[0]) / 864e5 / (d.length - 1)) : null; });
    if (id === "topcli") rows.sort((a,b) => b.tot - a.tot); else rows.sort((a,b) => b.n - a.n || (a.every ?? 1e9) - (b.every ?? 1e9));
    const tot = rows.reduce((s,e) => s + e.tot, 0);
    h += '<p class="count">' + rows.length + ' clientes con facturas en ' + S.pqYear + (id === "topcli" ? ' · ' + eur(tot) + ' con IVA' : '') + '</p>';
    h += '<div class="list">' + (rows.length ? rows.slice(0, 100).map((e, k) => pqRow((k + 1) + '. ' + esc(nameOf(e.code)),
        e.n + (e.n === 1 ? ' factura' : ' facturas') + (e.every ? ' · cada ' + e.every + ' días' : ''),
        id === "topcli" ? '<b>' + eur(e.tot) + '</b><br><small style="color:var(--muted)">' + (tot ? num(Math.round(e.tot / tot * 1000) / 10) + ' %' : '') + '</small>' : '<b>' + e.n + '</b>',
        'data-cli="' + esc(e.code) + '"')).join("") : '<div class="empty">Sin facturas ese año.</div>') + '</div>';
  }
  else if (id === "quien"){
    if (!S.pqArt){
      const arts = new Map(); all.forEach(i => i.lines.forEach(l => { if (l.code && !arts.has(l.code)) arts.set(l.code, l.desc); }));
      const words = norm(S.pqQ || "").split(/\s+/).filter(Boolean);
      const list = words.length ? [...arts.entries()].filter(([c,d]) => { const k = norm(c + " " + d); return words.every(w => k.includes(w)); }).slice(0, 60) : [];
      h += '<div class="search"><input id="pqq" type="search" placeholder="Busca el artículo por código o descripción" value="' + esc(S.pqQ || "") + '" autocomplete="off" aria-label="Buscar artículo"></div>';
      h += words.length ? '<div class="list">' + (list.length ? list.map(([c,d]) => pqRow(esc(d || c), '<span style="font-family:var(--f-mono)">' + esc(c) + '</span>', "", 'data-art="' + esc(c) + '"')).join("") : '<div class="empty">Ninguno de tus clientes ha comprado un artículo así.</div>') + '</div>'
        : '<div class="note">Escribe parte del código o de la descripción (por ejemplo <b>copa gastro</b>). Solo salen artículos que hayan comprado tus clientes.</div>';
    } else {
      const m = new Map(); let desc = "";
      all.slice().sort((a,b) => a.date - b.date).forEach(i => i.lines.forEach(l => { if (l.code !== S.pqArt) return; desc = l.desc || desc;
        const e = m.get(i.client) || { code: i.client, qty: 0 }; e.qty += l.qty; e.date = i.date; e.price = l.price; e.dto = l.dto; m.set(i.client, e); }));
      const rows = [...m.values()].sort((a,b) => b.date - a.date);
      h += '<p class="count"><span style="font-family:var(--f-mono)">' + esc(S.pqArt) + '</span> · ' + esc(desc) + ' · ' + rows.length + (rows.length === 1 ? ' cliente' : ' clientes') + ' · <button class="linkbtn" id="pqOtro" type="button">otro artículo</button></p>';
      h += '<div class="list">' + rows.map(e => pqRow(esc(nameOf(e.code)), 'última compra ' + fdate(e.date) + ' · ' + num(e.qty) + ' uds en total', priceHtml(e.price, e.dto), 'data-cli="' + esc(e.code) + '"')).join("") + '</div>';
    }
  }
  else if (id === "topart"){
    const now = new Date(), y = now.getFullYear();
    if (!["mes","anio","ant"].includes(S.pqPer)) S.pqPer = "anio";
    if (!["imp","uds"].includes(S.pqSort)) S.pqSort = "imp";
    h += pqChips([["mes","Este mes"],["anio","Este año"],["ant","Año " + (y - 1)]], S.pqPer, "data-pper");
    h += pqChips([["imp","Por importe"],["uds","Por unidades"]], S.pqSort, "data-psort");
    const inPer = d => S.pqPer === "mes" ? d.getFullYear() === y && d.getMonth() === now.getMonth() : S.pqPer === "anio" ? d.getFullYear() === y : d.getFullYear() === y - 1;
    const m = new Map();
    all.filter(i => inPer(i.date)).forEach(i => i.lines.forEach(l => { if (!l.code) return; const e = m.get(l.code) || { code: l.code, desc: l.desc, qty: 0, imp: 0, cli: new Set() }; e.qty += l.qty; e.imp += l.imp; e.cli.add(i.client); m.set(l.code, e); }));
    const rows = [...m.values()].sort(S.pqSort === "uds" ? (a,b) => b.qty - a.qty : (a,b) => b.imp - a.imp);
    h += '<p class="count">' + rows.length + ' artículos · importes sin IVA</p>';
    h += '<div class="list">' + (rows.length ? rows.slice(0, 100).map((e, k) => pqRow((k + 1) + '. ' + esc(e.desc || e.code),
        '<span style="font-family:var(--f-mono)">' + esc(e.code) + '</span> · ' + e.cli.size + (e.cli.size === 1 ? ' cliente' : ' clientes'),
        '<b>' + (S.pqSort === "uds" ? num(e.qty) + ' uds' : eur(e.imp)) + '</b><br><small style="color:var(--muted)">' + (S.pqSort === "uds" ? eur(e.imp) : num(e.qty) + ' uds') + '</small>',
        'data-art2="' + esc(e.code) + '"')).join("") : '<div class="empty">Sin ventas en ese periodo.</div>') + '</div>';
  }
  else if (id === "baja"){
    const now = new Date(), y = now.getFullYear(), lim = new Date(y - 1, now.getMonth(), now.getDate(), 23, 59);
    const m = new Map();
    all.forEach(i => { const d = i.date; let k = null;
      if (d.getFullYear() === y && d <= now) k = "cur"; else if (d.getFullYear() === y - 1 && d <= lim) k = "prev";
      if (!k) return; const e = m.get(i.client) || { code: i.client, cur: 0, prev: 0 }; e[k] += i.total; m.set(i.client, e); });
    const rows = [...m.values()].filter(e => e.prev > 0 && e.cur < e.prev).sort((a,b) => (b.prev - b.cur) - (a.prev - a.cur));
    h += '<p class="count">Del 1 de enero al ' + now.toLocaleDateString("es-ES",{day:"numeric",month:"long"}) + ', ' + (y - 1) + ' frente a ' + y + ' · ' + rows.length + ' clientes compran menos · con IVA</p>';
    h += '<div class="list">' + (rows.length ? rows.slice(0, 100).map(e => { const pc = Math.round((e.cur - e.prev) / e.prev * 100);
        return pqRow(esc(nameOf(e.code)), (y - 1) + ': ' + eur(e.prev) + ' → ' + y + ': ' + eur(e.cur), '<b style="color:var(--bad)">−' + num(Math.abs(pc)) + ' %</b><br><small style="color:var(--muted)">−' + eur(e.prev - e.cur) + '</small>', 'data-cli="' + esc(e.code) + '"'); }).join("")
      : '<div class="empty">Ningún cliente compra menos que el año pasado en este periodo.</div>') + '</div>';
  }
  view.innerHTML = h;
  document.getElementById("pqBack").onclick = () => { if (S.pq === "quien" && S.pqArt){ S.pqArt = null; } else { S.pq = null; } render(); window.scrollTo(0,0); };
  const inp = document.getElementById("pqq");

function viewInicio(){
  const mine = S.data.all.filter(i => { const c = S.data.byCode.get(i.client); return c && c.com === S.com && i.date; });
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const sum = a => a.reduce((s,i) => s + i.total, 0);
  const pct = (cur, prev) => { if (!prev) return '<span class="dsub">sin datos del año anterior</span>'; const p = Math.round((cur - prev) / Math.abs(prev) * 100); return '<span class="' + (p >= 0 ? "up" : "down") + '">' + (p >= 0 ? "+" : "−") + num(Math.abs(p)) + ' %</span>'; };
  const curM = sum(mine.filter(i => i.date.getFullYear() === y && i.date.getMonth() === m));
  const prevM = sum(mine.filter(i => i.date.getFullYear() === y - 1 && i.date.getMonth() === m && i.date.getDate() <= d));
  const curY = sum(mine.filter(i => i.date.getFullYear() === y));
  const lim = new Date(y - 1, m, d, 23, 59);
  const prevY = sum(mine.filter(i => i.date.getFullYear() === y - 1 && i.date <= lim));
  const pl = mine.filter(i => i.pend > 0.004), pT = pl.reduce((s,i) => s + i.pend, 0), pG = pl.filter(i => i.giro).reduce((s,i) => s + i.pend, 0);
  const viejas = pl.filter(i => daysSince(i.date) > 60).length;
  const dorm = myClients().filter(c => c.last && daysSince(c.last) > DORM_DIAS).length;
  const last = mine.slice().sort((a,b) => b.date - a.date || b.num.localeCompare(a.num, "es", {numeric:true})).slice(0, 5);
  const mes = MESES[m];
  let h = '<div class="dash">';
  h += '<button class="dcard" type="button" data-go="mes"><div class="dlbl">Este mes · ' + mes + '</div><div class="dbig">' + eur(curM) + '</div><div class="dsub">' + mes + ' ' + (y - 1) + ' (hasta el día ' + d + '): ' + eur(prevM) + ' · ' + pct(curM, prevM) + '</div></button>';
  h += '<button class="dcard" type="button" data-go="anio"><div class="dlbl">Este año · ' + y + '</div><div class="dbig">' + eur(curY) + '</div><div class="dsub">' + (y - 1) + ' hasta el ' + d + '/' + (m + 1) + ': ' + eur(prevY) + ' · ' + pct(curY, prevY) + '</div></button>';
  h += '<button class="dcard wide pendc" type="button" data-go="pend"><div class="dlbl" style="color:var(--bad)">Pendiente de cobro</div><div class="dbig" style="color:var(--bad)">' + eur(pT) + '</div><div class="dsub">A reclamar: <b>' + eur(pT - pG) + '</b> · En giro: ' + eur(pG) + '</div><div class="dsub">' + pl.length + (pl.length === 1 ? ' factura' : ' facturas') + (viejas ? ' · <b style="color:var(--bad)">' + viejas + ' de más de 2 meses</b>' : '') + '</div></button>';
  h += '<button class="dcard wide" type="button" data-go="dorm"><div class="dlbl">Clientes sin comprar</div><div class="dbig">' + dorm + '</div><div class="dsub">llevan más de ' + DORM_DIAS + ' días sin factura · ver la lista ›</div></button>';
  h += '<div class="dcard lcard" style="cursor:default"><div class="dlbl">Últimas facturas</div><div class="dlist">' + (last.length ? last.map(i => { const c = S.data.byCode.get(i.client);
      return '<button class="drow" type="button" data-cli="' + esc(i.client) + '"><span class="dn">' + esc((c && c.name) || i.name) + (fisc(c) ? '<small class="dm">' + esc(fisc(c)) + '</small>' : '') + '</span><span class="dd">' + fdate(i.date) + '</span><span class="da">' + eur(i.total) + '</span></button>'; }).join("") : '<div class="dsub">Sin facturas.</div>') + '</div></div>';
  // Clientes que más deben: solo lo que hay que reclamar (sin giro bancario), de mayor a menor
  const deb = new Map();
  for (const i of pl){ if (i.giro) continue;
    const e = deb.get(i.client) || { code: i.client, name: i.name, t: 0, b: 0, n: 0, old: i.date };
    e.t += i.pend; e.b += i.total ? i.pend * i.base / i.total : 0; e.n++; if (i.date < e.old) e.old = i.date;
    deb.set(i.client, e); }
  const top = [...deb.values()].filter(e => e.t > 0.004).sort((a,b) => b.t - a.t).slice(0, 6);
  h += '<div class="dcard lcard" style="cursor:default"><div class="dlbl" style="color:var(--bad)">Clientes que más deben · a reclamar</div><div class="dlist">' + (top.length ? top.map(e => { const c = S.data.byCode.get(e.code);
      return '<button class="drow debrow" type="button" data-deb="' + esc(e.code) + '" data-y="' + e.old.getFullYear() + '"><span class="dn">' + esc((c && c.name) || e.name) +
        (fisc(c) ? '<small class="dm">' + esc(fisc(c)) + '</small>' : '') +
        '<small class="dm">' + e.n + (e.n === 1 ? ' factura' : ' facturas') + ' · la más antigua, hace ' + antig(e.old) + '</small></span>' +
        amt2(e.t, e.b, "bad") + '</button>'; }).join("") : '<div class="dsub">No hay nada pendiente de reclamar.</div>') + '</div></div>';
  h += '</div>';
  view.innerHTML = h;
  view.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const g = b.dataset.go;
    if (g === "mes"){ S.sec = "facturacion"; S.fpend = false; S.fyear = y; const k = y + "-" + m; S.fopen = new Set([k]); S.scrollMonth = k; }
    else if (g === "anio"){ S.sec = "facturacion"; S.fpend = false; S.fyear = y; }
    else if (g === "pend"){ S.sec = "facturacion"; S.fpend = true; }
    else if (g === "dorm"){ S.sec = "clientes"; S.client = null; S.cf = "dorm"; }
    render(); if (g !== "mes") window.scrollTo(0,0);
  });
  view.querySelectorAll("[data-cli]").forEach(b => b.onclick = () => { S.sec = "clientes"; S.client = b.dataset.cli; S.ctab = "facturas"; S.year = null; S.open = new Set(); S.scrollEnd = true; render(); });
  view.querySelectorAll("[data-deb]").forEach(b => b.onclick = () => { S.sec = "clientes"; S.client = b.dataset.deb; S.ctab = "facturas"; S.year = +b.dataset.y; S.open = new Set(); S.scrollEnd = true; render(); });
}

/* ---------- Presupuestos ---------- */
const PRE_SERIE = { "34": "B", "36": "P" };
const preSerie = com => PRE_SERIE[com] || ("C" + com);
const P = { list: null, loading: false, err: null, mode: "list", cur: null, draft: null, dirty: false };
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const isoHoy = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const preFecha = s => fdate(dIso(s));
const nStr = v => (v == null || v === "" || !+v) ? "" : String(v).replace(".", ",");
let preKey = 0;
const newLine = t => ({ k: ++preKey, t, code: "", desc: "", qty: t === "a" ? "1" : "", price: "", d1: "", d2: "" });
const lineImp = l => l.t === "a" ? r2(toNum(l.qty) * toNum(l.price) * (1 - toNum(l.d1) / 100) * (1 - toNum(l.d2) / 100)) : 0;
function preTotals(lines){ const base = r2(lines.reduce((s, l) => s + lineImp(l), 0)), iva = r2(base * 0.21); return { base, iva, total: r2(base + iva) }; }
function comNomFor(com){
  if (S.user && !S.user.admin && S.user.nombre) return S.user.nombre;
  const b = document.querySelector('.seg [data-com="' + com + '"]');
  return b ? b.textContent.replace(/\s*\(\d+\)\s*$/, "").trim() : "Comercial " + com;
}
const canShareFiles = (() => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File([""], "x.pdf", { type: "application/pdf" })] })); } catch(e){ return false; } })();

async function loadPres(){
  if (P.loading) return;
  P.loading = true; P.err = null;
  try {
    let q = db.collection("presupuestos");
    if (!(S.user && S.user.admin)) q = q.where("com", "==", S.com);
    const snap = await q.get();
    const l = []; snap.forEach(d => l.push({ id: d.id, ...d.data() }));
    l.sort((a, b) => (b.creado || 0) - (a.creado || 0));
    P.list = l;
  } catch(e){ P.err = fbErr(e); }
  P.loading = false;
  if (S.sec === "presupuestos" && P.mode === "list") viewPres(true);
}
function draftFrom(p, keep){
  const d = { com: p.com, fecha: keep ? p.fecha : isoHoy(), cli: p.cli ? { ...p.cli } : null, cliMode: p.cli && p.cli.nuevo ? "nuevo" : "lista",
    lines: (p.lines || []).map(l => ({ k: ++preKey, t: l.t, code: l.code || "", desc: l.desc || "", qty: nStr(l.qty), price: nStr(l.price), d1: nStr(l.d1), d2: nStr(l.d2) })) };
  if (keep){ d.id = p.id; d.num = p.num; d.n = p.n; d.comNom = p.comNom; }
  if (!d.lines.length) d.lines.push(newLine("a"));
  return d;
}
function preLeave(){ if (P.mode === "edit" && P.dirty && !confirm("Hay cambios sin guardar. ¿Salir sin guardar?")) return false; return true; }

function viewPres(force){
  if (!S.user) return;
  if (P.mode === "edit"){ if (!force && document.getElementById("preEd")) return; return preEditor(); }
  if (P.mode === "ver" && P.cur) return preDetail();
  P.mode = "list";
  if (!P.list){
    if (P.err){ view.innerHTML = '<div class="note err"><b>No se han podido leer los presupuestos.</b><br>' + esc(P.err) + '<br><button class="btn" id="retryP" type="button">Reintentar</button></div>';
      document.getElementById("retryP").onclick = () => { P.err = null; loadPres(); viewPres(true); }; return; }
    view.innerHTML = '<div class="note"><b>Leyendo presupuestos…</b></div>'; loadPres(); return;
  }
  const adm = S.user.admin;
  let h = '<div class="toolbar"><button class="btn" id="preNew" type="button">+ Nuevo presupuesto</button><span class="sp"></span><span class="count" style="margin:0">' + P.list.length + ' presupuesto' + (P.list.length === 1 ? '' : 's') + '</span></div>';
  h += '<div class="list">' + (P.list.length ? P.list.map(p => {
    const c = p.cli || {};
    return '<button type="button" class="row" data-pre="' + esc(p.id) + '"><div class="main"><div class="name">' + esc(p.num) + ' · ' + esc(c.name || c.fiscal || "") + '</div><div class="sub">' + preFecha(p.fecha) + (adm ? ' · ' + esc(p.comNom || "") : '') + (c.nuevo ? ' · cliente nuevo' : (c.code ? ' · ' + esc(c.code) : '')) + '</div></div><div class="right"><b style="color:var(--ink)">' + eur(p.total) + '</b><br>' + eur(p.base) + ' sin IVA</div>' + chev + '</button>';
  }).join("") : '<div class="empty">Todavía no hay presupuestos. Pulsa <b>+ Nuevo presupuesto</b>.</div>') + '</div>';
  view.innerHTML = h;
  document.getElementById("preNew").onclick = () => {
    P.draft = { com: S.com, fecha: isoHoy(), cli: null, cliMode: "lista", lines: [newLine("a")] };
    P.mode = "edit"; P.dirty = false; viewPres(true); window.scrollTo(0, 0);
  };
  view.querySelectorAll("[data-pre]").forEach(b => b.onclick = () => { P.cur = P.list.find(p => p.id === b.dataset.pre); P.mode = "ver"; viewPres(true); window.scrollTo(0, 0); });
}

function preDetail(){
  const p = P.cur, c = p.cli || {};
  const sub = [c.code ? "Cód. " + c.code : (c.nuevo ? "Cliente nuevo" : ""), c.nif ? "NIF " + c.nif : "", c.pob].filter(Boolean).join(" · ");
  let h = '<button class="back" id="preBack" type="button">‹ Presupuestos</button>';
  h += '<div class="client-head"><h2>Presupuesto ' + esc(p.num) + '</h2><p>' + preFecha(p.fecha) + ' · ' + esc(p.comNom || "") + '</p></div>';

    ? '<div class="ln"><span class="d" style="font-weight:600;white-space:pre-wrap">' + esc(l.desc) + '</span><span></span></div>'
    : '<div class="ln"><span class="d">' + esc(l.desc) + (l.code ? '<br><span class="c">' + esc(l.code) + '</span>' : '') + '</span><span class="p"><b>' + eur(l.imp) + '</b></span>' +
      '<span class="q" style="grid-column:1/-1;text-align:left">' + num(l.qty) + ' uds × ' + eur(l.price) + (+l.d1 ? '<span class="dto">-' + num(l.d1) + ' %</span>' : '') + (+l.d2 ? '<span class="dto">-' + num(l.d2) + ' %</span>' : '') + '</span></div>').join("") + '</div></div>';
  h += '<div class="sumbox" style="margin-top:12px"><div><div class="lbl">Total</div><div class="big">' + eur(p.total) + '</div></div><div class="count" style="margin:0;text-align:right">Base ' + eur(p.base) + '<br>IVA 21 % ' + eur(p.iva) + '</div></div>';
  h += '<div class="pe-btns">' + (canShareFiles ? '<button class="btn" id="preShare" type="button">Compartir PDF</button>' : '') +
    '<button class="btn" id="prePdf" type="button"' + (canShareFiles ? ' style="background:var(--slate)"' : '') + '>Descargar PDF</button>' +
    '<button class="chipbtn" id="preEdit" type="button">Editar</button><button class="chipbtn" id="preDup" type="button">Duplicar</button><span class="sp" style="flex:1"></span><button class="chipbtn pe-del" id="preDel" type="button">Borrar</button></div><div class="msg" id="preDelMsg" role="status"></div>';
  h += '<div class="count" style="margin-top:10px">' + (canShareFiles ? 'Compartir PDF abre WhatsApp, correo, etc. ' : '') + 'El presupuesto no pasa a Factusol.</div>';
  view.innerHTML = h;
  document.getElementById("preBack").onclick = () => { P.mode = "list"; P.cur = null; viewPres(true); };
  const sh = document.getElementById("preShare"); if (sh) sh.onclick = () => prePdf(p, true, sh);
  const dl = document.getElementById("prePdf"); dl.onclick = () => prePdf(p, false, dl);
  document.getElementById("preEdit").onclick = () => { P.draft = draftFrom(p, true); P.mode = "edit"; P.dirty = false; viewPres(true); window.scrollTo(0, 0); };
  document.getElementById("preDel").onclick = async () => {
    if (!confirm("¿Borrar el presupuesto " + p.num + "? No se puede deshacer.")) return;
    const b = document.getElementById("preDel"), m = document.getElementById("preDelMsg");
    b.disabled = true; b.textContent = "Borrando…";
    try {
      await db.collection("presupuestos").doc(p.id).delete();
      if (P.list) P.list = P.list.filter(x => x.id !== p.id);
      P.cur = null; P.mode = "list"; viewPres(true); window.scrollTo(0, 0);
    } catch(e){
      b.disabled = false; b.textContent = "Borrar"; m.className = "msg err";
      const c = e && e.code || "";
      m.textContent = c === "permission-denied" ? "No se pudo borrar: falta publicar las reglas nuevas de Firebase. Avisa a Dani." : c === "unavailable" ? "Sin conexión. Revisa internet y vuelve a intentarlo." : "No se pudo borrar (" + (c || (e && e.message) || "error") + ").";
    }
  };
  document.getElementById("preDup").onclick = () => { P.draft = draftFrom(p, false); P.mode = "edit"; P.dirty = true; viewPres(true); window.scrollTo(0, 0); };
}

function prePdf(p, share, btn){
  const old = btn.textContent;
  const done = m => { btn.textContent = m; setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2200); };
  try {
    const R = window.FACTURA_RES;
    if (!window.jspdf || !R || !window.presupuestoIberlus) return done("No disponible");
    btn.disabled = true;
    const doc = window.presupuestoIberlus(window.jspdf.jsPDF, p, R);
    const c = p.cli || {};
    const name = ("Presupuesto_" + p.num + "_" + (c.name || c.fiscal || "")).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, "_").replace(/[^A-Za-z0-9_.\-]/g, "").replace(/_+/g, "_").slice(0, 80) + ".pdf";
    const blob = doc.output("blob");
    if (share && canShareFiles){
      const file = new File([blob], name, { type: "application/pdf" });
      navigator.share({ files: [file], title: "Presupuesto " + p.num }).then(() => done("Compartido"), () => { btn.textContent = old; btn.disabled = false; });
      return;
    }
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    done("Descargado");
  } catch(e){ done("No se pudo generar"); }
}

/* --- editor --- */
