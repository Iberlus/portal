function preCliRender(focus){
  const d = P.draft, box = document.getElementById("preCli"); if (!box) return;
  const seg = '<div class="years"><button class="chipbtn" type="button" data-cm="lista" aria-pressed="' + (d.cliMode === "lista") + '">De mis clientes</button><button class="chipbtn" type="button" data-cm="nuevo" aria-pressed="' + (d.cliMode === "nuevo") + '">Cliente nuevo</button></div>';
  let h = '';
  if (d.cliMode === "lista" && d.cli){
    const c = d.cli;
    h = '<div class="pe-sel"><div><b>' + esc(c.name || c.fiscal) + '</b>' + (fisc(c) ? '<div class="count" style="margin:0">' + esc(c.fiscal) + '</div>' : '') +
      '<div class="count" style="margin:0">' + esc([c.code, c.nif ? "NIF " + c.nif : "", c.pob].filter(Boolean).join(" · ")) + '</div></div><button class="linkbtn" type="button" id="cliChg">Cambiar</button></div>';
  } else if (d.cliMode === "lista"){
    h = seg + '<div class="search" style="margin:0"><input id="cliQ" type="search" placeholder="Buscar por código o nombre" autocomplete="off" aria-label="Buscar cliente" value="' + esc(d.cliQ || "") + '"></div><div id="cliRes"></div>';
  } else {
    const c = d.cli || {};
    const f = (k, lbl, req, type, im) => '<label class="fld">' + lbl + (req ? ' *' : '') + '<input data-cf="' + k + '" type="' + (type || "text") + '"' + (im ? ' inputmode="' + im + '"' : '') + ' value="' + esc(c[k] || "") + '" autocomplete="off"></label>';
    h = seg + '<div class="pe-grid">' + f("name", "Nombre", true) + f("nif", "NIF") + f("pob", "Población") + f("tel", "Teléfono", false, "tel", "tel") + f("email", "Correo", false, "email", "email") + '</div>';
  }
  box.innerHTML = h;
  box.querySelectorAll("[data-cm]").forEach(b => b.onclick = () => {
    if (d.cliMode === b.dataset.cm) return;
    d.cliMode = b.dataset.cm; d.cli = d.cliMode === "nuevo" ? { nuevo: true, name: "", nif: "", pob: "", tel: "", email: "" } : null; P.dirty = true;
    preCliRender(true);
  });
  const chg = document.getElementById("cliChg"); if (chg) chg.onclick = () => { d.cli = null; d.cliQ = ""; P.dirty = true; preCliRender(true); };
  box.querySelectorAll("[data-cf]").forEach(i => i.oninput = () => { d.cli[i.dataset.cf] = i.value; P.dirty = true; });
  const q = document.getElementById("cliQ");
  if (q){
    let t; q.oninput = () => { clearTimeout(t); t = setTimeout(() => { d.cliQ = q.value; preCliRes(); }, 120); };
    preCliRes();
    if (focus) q.focus();
  } else if (focus){ const n = box.querySelector('[data-cf="name"]'); if (n) n.focus(); }
}
function preCliRes(){
  const d = P.draft, box = document.getElementById("cliRes"); if (!box) return;
  if (!S.data){ box.innerHTML = '<div class="count" style="margin:8px 0 0">Cargando tus clientes…</div>'; return; }
  const words = norm(d.cliQ).split(/\s+/).filter(Boolean);
  if (!words.length){ box.innerHTML = '<div class="count" style="margin:8px 0 0">Escribe el código o parte del nombre. Si no está, pulsa <b>Cliente nuevo</b>.</div>'; return; }
  const mine = S.data.clients.filter(c => c.com === d.com);
  const l = mine.filter(c => { const k = norm(c.code + " " + c.name + " " + c.fiscal + " " + c.pob); return words.every(w => k.includes(w)); })
    .sort((a, b) => (b.last || 0) - (a.last || 0)).slice(0, 15);
  box.innerHTML = '<div class="list" style="margin-top:8px">' + (l.length ? l.map(c => '<button type="button" class="row" data-pc="' + esc(c.code) + '"><div class="main"><div class="name">' + esc(c.name) + '</div><div class="sub">' + esc([c.code, fisc(c), c.pob].filter(Boolean).join(" · ")) + '</div></div></button>').join("")
    : '<div class="empty">Ningún cliente coincide. Pulsa <b>Cliente nuevo</b> para escribirlo a mano.</div>') + '</div>';
  box.querySelectorAll("[data-pc]").forEach(b => b.onclick = () => {
    const c = S.data.byCode.get(b.dataset.pc); if (!c) return;
    d.cli = { code: c.code, name: c.name, fiscal: c.fiscal, nif: c.nif, pob: c.pob, cp: c.cp, prov: c.prov }; P.dirty = true;
    preCliRender();
    const first = document.querySelector('#preLines [data-f="code"]'); if (first && !first.value) first.focus();
  });
}

const NAV = { a: ["code", "desc", "qty", "price", "d1", "d2"], x: ["desc"] };
function preLineHtml(l, i, n){
  const act = '<div class="pl-act"><button type="button" data-mv="-1" aria-label="Subir"' + (i ? '' : ' disabled') + '>↑</button><button type="button" data-mv="1" aria-label="Bajar"' + (i < n - 1 ? '' : ' disabled') + '>↓</button><button type="button" data-del aria-label="Borrar línea">✕</button></div>';
  if (l.t === "x") return '<div class="pl txt" data-k="' + l.k + '"><textarea class="in" data-f="desc" rows="2" placeholder="Texto, por ejemplo: Forma de pago: transferencia a la entrega">' + esc(l.desc) + '</textarea>' + act + '</div>';
  const nf = (f, lbl) => '<label class="pl-n">' + lbl + '<input class="in" data-f="' + f + '" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="' + esc(l[f]) + '"></label>';
  return '<div class="pl" data-k="' + l.k + '"><div class="pl-r1"><div class="pl-code"><input class="in mono" data-f="code" placeholder="Código o nombre" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next" value="' + esc(l.code) + '"><div class="ac" hidden></div></div>' +
    '<input class="in" data-f="desc" placeholder="Descripción" enterkeyhint="next" autocomplete="off" value="' + esc(l.desc) + '"></div>' +
    '<div class="pl-r2">' + nf("qty", "Uds") + nf("price", "Precio") + nf("d1", "Dto 1 %") + nf("d2", "Dto 2 %") + '<div class="pl-tot"><small>Total</small><b data-tot>' + eur(lineImp(l)) + '</b></div></div>' + act + '</div>';
}
function preLinesRender(fi, ff){
  const d = P.draft, box = document.getElementById("preLines"); if (!box) return;
  box.innerHTML = d.lines.length ? d.lines.map((l, i) => preLineHtml(l, i, d.lines.length)).join("") : '<div class="empty">Sin líneas. Añade un artículo o un texto.</div>';
  preTotRender();
  if (fi != null && ff){ const row = box.children[fi]; const el = row && row.querySelector('[data-f="' + ff + '"]'); if (el){ el.focus(); el.scrollIntoView({ block: "center", behavior: "smooth" }); } }
}
function preTotRender(){
  const t = preTotals(P.draft.lines), el = document.getElementById("preTot"); if (!el) return;
  el.innerHTML = '<span>Base <b>' + eur(t.base) + '</b></span><span>IVA 21 % <b>' + eur(t.iva) + '</b></span><span class="big">Total <b>' + eur(t.total) + '</b></span>';
}
const lineOf = el => { const row = el.closest(".pl"); if (!row) return {}; const i = [...row.parentNode.children].indexOf(row); return { row, i, l: P.draft.lines[i] }; };
function acMatches(q){
  const qc = q.trim().toUpperCase(), words = norm(q).split(/\s+/).filter(Boolean); if (!qc || !S.arts) return [];
  const byCode = [], byName = [];
  for (const a of S.arts){ if (!a.cu) a.cu = a.code.toUpperCase();
    if (a.cu.startsWith(qc)) byCode.push(a); else if (words.every(w => a.k.includes(w))) byName.push(a); }
  const cmp = (a, b) => a.cu.localeCompare(b.cu, "es", { numeric: true });
  byCode.sort((a, b) => (a.cu === qc ? -1 : b.cu === qc ? 1 : cmp(a, b)));
  return byCode.concat(byName.sort(cmp));
}
function acShow(inp){
  const ac = inp.parentNode.querySelector(".ac"); if (!ac) return;
  const q = inp.value.trim();
  if (!q){ ac.hidden = true; ac.innerHTML = ""; return; }
  if (!S.arts){ ac.hidden = false; ac.innerHTML = '<div class="ac-note">' + (S.artsErr ? 'No se pudo leer el almacén' : 'Cargando artículos…') + '</div>'; return; }
  const m = acMatches(q);
  ac._m = m; ac._h = 0;
  if (!m.length){ ac.hidden = false; ac.innerHTML = '<div class="ac-note">No hay artículos con ese código o nombre: escribe la descripción a mano.</div>'; return; }
  ac.hidden = false;
  ac.innerHTML = m.slice(0, 40).map((a, k) => '<button type="button" class="ac-it' + (k ? '' : ' on') + '" data-ac="' + k + '" tabindex="-1"><span class="c">' + esc(a.code) + '</span><span class="dd">' + esc(a.desc) + '</span><span class="st' + (a.stock < 0 ? ' neg' : a.stock === 0 ? ' zero' : '') + '">' + num(a.stock) + ' uds</span></button>').join("") +
    (m.length > 40 ? '<div class="ac-note">' + m.length.toLocaleString("es-ES") + ' artículos · sigue escribiendo para acotar</div>' : '');
}
function acHide(inp){ const ac = inp && inp.parentNode.querySelector(".ac"); if (ac){ ac.hidden = true; ac.innerHTML = ""; ac._m = null; } }
function acPick(inp, k){
  const ac = inp.parentNode.querySelector(".ac"), a = ac && ac._m && ac._m[k]; if (!a) return false;
  const { row, l } = lineOf(inp);
  l.code = a.code; l.desc = a.desc; inp.value = a.code; row.querySelector('[data-f="desc"]').value = a.desc; P.dirty = true;
  acHide(inp);
  const q = row.querySelector('[data-f="qty"]'); q.focus();
  return true;
}
function preFocusNext(el){
  const { row, i, l } = lineOf(el); if (!l) return;
  const order = NAV[l.t], f = el.dataset.f, k = order.indexOf(f);
  if (k < order.length - 1){ row.querySelector('[data-f="' + order[k + 1] + '"]').focus(); return; }
  const d = P.draft;
  if (i === d.lines.length - 1){ d.lines.push(newLine("a")); P.dirty = true; preLinesRender(i + 1, "code"); return; }
  const nx = document.getElementById("preLines").children[i + 1];
  const nl = d.lines[i + 1]; const t = nx && nx.querySelector('[data-f="' + NAV[nl.t][0] + '"]'); if (t) t.focus();
}
function preLinesEvents(){
  const box = document.getElementById("preLines");
  box.addEventListener("input", e => {
    const el = e.target, f = el.dataset.f; if (!f) return;
    const { row, l } = lineOf(el); if (!l) return;
    l[f] = el.value; P.dirty = true;
    if (f === "code") acShow(el);
    if (["qty", "price", "d1", "d2"].includes(f)){ row.querySelector("[data-tot]").textContent = eur(lineImp(l)); preTotRender(); }
  });
  box.addEventListener("focusin", e => {
    const el = e.target; if (!el.dataset || !el.dataset.f) return;
    if (el.tagName === "INPUT" && el.dataset.f !== "desc"){ const v0 = el.value, sel = () => { try { if (document.activeElement === el && el.value === v0){ el.select(); el.setSelectionRange(0, el.value.length); } } catch(x){} }; sel(); setTimeout(sel, 0); }
    if (el.dataset.f === "code" && el.value) acShow(el);
  });
  box.addEventListener("focusout", e => {
    const el = e.target, f = el.dataset && el.dataset.f; if (!f) return;
    if (f === "code") setTimeout(() => { if (document.activeElement !== el) acHide(el); }, 200);
    if (["qty", "price", "d1", "d2"].includes(f) && el.value.trim()){
      const { l } = lineOf(el); const v = toNum(el.value); const s = v ? String(Math.round(v * 10000) / 10000).replace(".", ",") : "";
      if (l){ l[f] = s; el.value = s; }
    }
  });
  box.addEventListener("keydown", e => {
    const el = e.target, f = el.dataset && el.dataset.f; if (!f) return;
    if (f === "code"){
      const ac = el.parentNode.querySelector(".ac");
      if (ac && !ac.hidden && ac._m && ac._m.length){
        const items = ac.querySelectorAll(".ac-it");
        if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); ac._h = Math.max(0, Math.min(items.length - 1, ac._h + (e.key === "ArrowDown" ? 1 : -1)));
          items.forEach((b, k) => b.classList.toggle("on", k === ac._h)); items[ac._h].scrollIntoView({ block: "nearest" }); return; }
        if (e.key === "Enter"){ e.preventDefault(); acPick(el, ac._h); return; }
        if (e.key === "Escape"){ acHide(el); return; }
      }
    }
    if (e.key === "Enter" && el.tagName === "INPUT"){ e.preventDefault(); acHide(el); preFocusNext(el); }
  });
  box.addEventListener("pointerdown", e => { if (e.target.closest(".ac-it")) e.preventDefault(); });
  box.addEventListener("mouseup", e => { const el = e.target; if (el.tagName === "INPUT" && el.dataset.f && el.dataset.f !== "desc" && el._fresh){ e.preventDefault(); } el._fresh = false; });
  box.addEventListener("mousedown", e => { const el = e.target; if (el.tagName === "INPUT" && el.dataset.f) el._fresh = document.activeElement !== el; });
  box.addEventListener("click", e => {
    const it = e.target.closest(".ac-it");
    if (it){ const inp = it.closest(".pl-code").querySelector('[data-f="code"]'); acPick(inp, +it.dataset.ac); return; }
    const mv = e.target.closest("[data-mv]"), del = e.target.closest("[data-del]");
    if (!mv && !del) return;
    const { i, l } = lineOf(e.target); if (!l) return;
    const d = P.draft;
    if (del){
      if ((l.code || l.desc || l.price) && !confirm("¿Borrar esta línea?")) return;
      d.lines.splice(i, 1); P.dirty = true; preLinesRender(); return;
    }
    const j = i + +mv.dataset.mv; if (j < 0 || j >= d.lines.length) return;
    [d.lines[i], d.lines[j]] = [d.lines[j], d.lines[i]]; P.dirty = true; preLinesRender();
    const b = document.getElementById("preLines").children[j]; const bt = b && b.querySelector('[data-mv="' + mv.dataset.mv + '"]'); if (bt && !bt.disabled) bt.focus();
  });
}

async function preSave(){
  const d = P.draft, msg = document.getElementById("preMsg"), btn = document.getElementById("preSave");
  const err = t => { msg.className = "msg err"; msg.textContent = t; };
  const c = d.cli;
  if (!c || !str(c.name)){ err(d.cliMode === "nuevo" ? "Escribe el nombre del cliente." : "Elige un cliente o pulsa «Cliente nuevo»."); return; }
  const lines = d.lines.filter(l => l.t === "x" ? str(l.desc) : (str(l.code) || str(l.desc) || toNum(l.price)))
    .map(l => l.t === "x" ? { t: "x", desc: str(l.desc) } : { t: "a", code: str(l.code), desc: str(l.desc), qty: toNum(l.qty), price: toNum(l.price), d1: toNum(l.d1), d2: toNum(l.d2), imp: lineImp(l) });
  if (!lines.some(l => l.t === "a")){ err("Añade al menos un artículo."); return; }
  const tot = preTotals(lines);
  const cli = c.nuevo ? { nuevo: true, name: str(c.name), nif: str(c.nif), pob: str(c.pob), tel: str(c.tel), email: str(c.email) }
    : { code: str(c.code), name: str(c.name), fiscal: str(c.fiscal), nif: str(c.nif), pob: str(c.pob), cp: str(c.cp), prov: str(c.prov) };
  const data = { fecha: d.fecha || isoHoy(), cli, lines, base: tot.base, iva: tot.iva, total: tot.total, mod: Date.now(), modPor: S.user.email };
  btn.disabled = true; btn.textContent = "Guardando…"; msg.className = "msg"; msg.textContent = "";
  try {
    let saved;
    if (d.id){
      await db.collection("presupuestos").doc(d.id).update(data);
      const old = (P.list || []).find(p => p.id === d.id) || P.cur || {};
      saved = { ...old, ...data, id: d.id };
    } else {
      const com = d.com, comNom = comNomFor(com), cRef = db.collection("contadores").doc(com);
      saved = await db.runTransaction(async tx => {
        const cs = await tx.get(cRef);
        const n = ((cs.exists && +cs.data().n) || 0) + 1;
        const id = com + "-" + n, doc = { ...data, com, n, num: preSerie(com) + "-" + n, comNom, autor: S.user.email, creado: Date.now() };
        tx.set(cRef, { n }, { merge: true });
        tx.set(db.collection("presupuestos").doc(id), doc);
        return { ...doc, id };
      });
    }
    if (P.list){ const k = P.list.findIndex(p => p.id === saved.id); if (k >= 0) P.list[k] = saved; else P.list.unshift(saved); }
    P.cur = saved; P.draft = null; P.dirty = false; P.mode = "ver"; viewPres(true); window.scrollTo(0, 0);
  } catch(e){
    btn.disabled = false; btn.textContent = "Guardar";
    const code = e && e.code || "";
    err(code === "unavailable" ? "Sin conexión. Revisa internet y vuelve a pulsar Guardar." : code === "permission-denied" ? "No tienes permiso para guardar presupuestos. Avisa a Dani." : "No se pudo guardar (" + (code || (e && e.message) || "error") + ").");
  }
}

function render(){
  if (S.sec === "cuenta") return viewCuenta();
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.com === S.com));
  document.querySelectorAll("nav.bottom button").forEach(b => b.setAttribute("aria-selected", b.dataset.sec === S.sec));
  if (S.sec === "almacen") return viewAlmacen();
  if (S.sec === "presupuestos") return viewPres();
  if (!S.data) return;
  if (S.sec === "inicio") return viewInicio();
  if (S.sec === "preguntas") return viewPreguntas();
  if (S.sec === "facturacion") return viewFacturacion();
  S.client ? viewClient() : viewClients();
}

document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { if (!S.user || !S.user.admin || S.com === b.dataset.com) return; S.com = b.dataset.com; S.client = null; S.q = ""; S.fopen = new Set(); S.fopenInv = new Set(); try{ localStorage.setItem("iberlus_com", S.com); }catch(e){} render(); loadAll(); });
document.getElementById("userBtn").onclick = () => { S.sec = S.sec === "cuenta" ? "inicio" : "cuenta"; render(); window.scrollTo(0,0); };
view.addEventListener("click", e => { const b = e.target.closest("[data-dl]"); if (b) downloadInv(b.dataset.dl, b); });
document.querySelectorAll("nav.bottom button").forEach(b => b.onclick = () => { if (S.sec === "presupuestos" && b.dataset.sec === "presupuestos" && P.mode !== "list"){ if (!preLeave()) return; P.mode = "list"; P.draft = null; P.cur = null; P.dirty = false; viewPres(true); window.scrollTo(0,0); return; } S.sec = b.dataset.sec; render(); window.scrollTo(0,0); });

const loginEl = document.getElementById("login"), appEl = document.getElementById("app"), lgMsg = document.getElementById("lgMsg");
document.getElementById("loginForm").onsubmit = async ev => {
  ev.preventDefault();
  const btn = document.getElementById("lgBtn"); btn.disabled = true; lgMsg.className = "msg"; lgMsg.textContent = "Entrando…";
  try { await auth.signInWithEmailAndPassword(document.getElementById("lgEmail").value.trim(), document.getElementById("lgPass").value); lgMsg.textContent = ""; }
  catch(e){
    const c = e.code || "";
    lgMsg.className = "msg err";
    lgMsg.textContent = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? "Email o contraseña incorrectos." : c === "auth/too-many-requests" ? "Demasiados intentos. Espera unos minutos y vuelve a probar." : c === "auth/network-request-failed" ? "Sin conexión a internet." : "No se pudo entrar (" + c + ").";
  }
  btn.disabled = false;
};
document.getElementById("lgForgot").onclick = async () => {
  const email = document.getElementById("lgEmail").value.trim();
  if (!email){ lgMsg.className = "msg err"; lgMsg.textContent = "Escribe primero tu email."; return; }
  try { await auth.sendPasswordResetEmail(email); lgMsg.className = "msg ok"; lgMsg.textContent = "Si el email existe, te llegará un correo para poner una contraseña nueva. Mira también en spam."; }
  catch(e){ lgMsg.className = "msg err"; lgMsg.textContent = "No se pudo enviar el correo (" + (e.code || "error") + ")."; }
};
auth.onAuthStateChanged(async u => {
  S.data = null; S.arts = null; S.artsErr = null; S.user = null; S.client = null; S.sec = "inicio"; S.compras = null; S.comprasErr = null; S.artOpen = null; S.hmore = {}; P.list = null; P.err = null; P.mode = "list"; P.cur = null; P.draft = null; P.dirty = false;
  if (!u){ appEl.hidden = true; loginEl.hidden = false; return; }
  loginEl.hidden = true; appEl.hidden = false;
  view.innerHTML = '<div class="note"><b>Comprobando tu acceso…</b></div>';
  try {
    const p = await db.doc("usuarios/" + u.email.toLowerCase()).get();
    if (!p.exists){ view.innerHTML = '<div class="note err"><b>Tu usuario todavía no tiene acceso.</b><br>Avisa a Dani.<br><button class="btn" id="out" type="button">Salir</button></div>'; document.getElementById("out").onclick = () => auth.signOut(); return; }
    const d = p.data();
    S.user = { email: u.email, nombre: d.nombre || "", admin: !!d.admin };
    document.getElementById("adminBar").hidden = !S.user.admin;
    document.getElementById("userBtn").textContent = S.user.nombre || "Cuenta";
    if (!S.user.admin) S.com = str(d.comercial);
    loadMeta(); loadAll();
  } catch(e){
    view.innerHTML = '<div class="note err"><b>No se pudo comprobar tu acceso.</b><br>' + esc(fbErr(e)) + '<br><button class="btn" id="out" type="button">Salir</button></div>';
    document.getElementById("out").onclick = () => auth.signOut();
  }
});
})();
